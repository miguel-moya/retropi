<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>/* tema antes de pintar nada (evita parpadeo y ajusta la barra de estado del iPhone) */
(function(){var t='auto';try{t=(JSON.parse(localStorage.getItem('rp.ui'))||{}).tema||'auto'}catch(e){}
var claro=t==='claro'||(t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches);
document.documentElement.dataset.tema=claro?'claro':'oscuro';
document.write('<meta name="apple-mobile-web-app-status-bar-style" content="'+(claro?'default':'black-translucent')+'">');})();</script>
<meta name="apple-mobile-web-app-title" content="RetroPi">
<title>RetroPi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151B; --s1:#1A1E26; --s2:#252A34;
  --glass:rgba(var(--ink),.055); --glass2:rgba(var(--ink),.09); --gline:rgba(var(--ink),.10);
  --tx:#F2F3F5; --tx2:#C9CED6; --mut:#9AA1AE;
  --ink:255,255,255; --bgrgb:18,21,27; --barrgb:30,34,43; --sh:rgba(0,0,0,.4); --bgtop:#1C2230; --chipb:#2A2D33; --chipf:#C3C8D1;
  --acc:#2AD8D2; --amb:#F5B841; --grn:#4FD18B; --red:#FF8A7A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
#app{min-height:calc(100vh + 1px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bgtop) 0%,var(--bg) 60%) fixed,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acc)}
img{display:block}
svg{pointer-events:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 20px) 16px calc(120px + var(--sb))}
.disp{font-family:var(--font);font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.05}
.eyebrow{margin:0;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:12px}
/* cristal */
.glass,.card,.g,.tile,.search,.pill,.small-btn,.seg,.gbtn,.capsule,.circle,.status{
  background:var(--glass);border:1px solid var(--gline);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.card{border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--cb,var(--chipb));color:var(--cf,var(--chipf))}
/* filas clave-valor, segmentado ancho, gráficas */
.kv > div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;font-size:14px}
.kv > div + div{border-top:1px solid rgba(var(--ink),.07)}
.kv > div > span{color:var(--tx2)}.kv b{font-weight:600;text-align:right}
.seg.ancho{display:grid;grid-template-columns:repeat(3,1fr);border-radius:14px;padding:4px}
.seg.ancho button{width:auto;height:36px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx2)}
.hbar{display:flex;flex-direction:column;gap:12px;padding:16px}
.hbar > div{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:12px}
.hbar i{display:block;height:10px;border-radius:999px;background:var(--acc)}
.hbar em{font-style:normal;color:var(--tx2);font-weight:600}
.secbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;text-decoration:none;color:var(--tx);font-weight:600;font-size:14px}
/* caja de balance */
.caja-bal{display:flex;flex-direction:column}
.caja-bal .cb-valor{padding:18px 16px 16px;display:flex;flex-direction:column;gap:4px}
.caja-bal .cb-valor > span,.caja-bal .par > div > span{font-size:12px;color:var(--mut)}
.caja-bal .cb-valor b{font-family:var(--font);font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--amb);line-height:1.05}
.caja-bal .par{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(var(--ink),.07)}
.caja-bal .par > div{padding:12px 16px;display:flex;flex-direction:column;gap:3px}
.caja-bal .par b{font-family:var(--font);font-size:19px;font-weight:700;letter-spacing:-.02em}
.sec-t{margin:8px 0 -4px;font-size:15px;font-weight:600}
/* búsqueda avanzada */
.filtbtn{position:relative;flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--tx)}
.filtbtn span{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--acc);color:#0B1020;font-size:11px;font-weight:800;display:grid;place-items:center}
.filtbtn span:empty{display:none}
.res-cab{display:flex;flex-direction:column;gap:8px;padding:12px 2px 0;font-size:12px;color:var(--mut)}
.res-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag.quita{cursor:pointer;color:var(--tx)}.tag.quita b{font-weight:800;opacity:.6;margin-left:2px}
.velo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
.hoja-panel{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:86vh;display:flex;flex-direction:column;
  background:rgb(var(--barrgb));border-radius:24px 24px 0 0;border:1px solid var(--gline);box-shadow:0 -10px 40px var(--sh);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.hoja-panel.on{transform:none}
.hp-cab{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(var(--ink),.07)}
.hp-cab .lnk{justify-self:start;font-size:14px;color:var(--tx2)}.hp-cab .lnk:last-child{justify-self:end}
.hp-cuerpo{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.hp-cuerpo h3{margin:12px 0 0;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.hp-pie{padding:12px 16px calc(12px + var(--sb));border-top:1px solid rgba(var(--ink),.07)}
.wrapp{display:flex;flex-wrap:wrap;gap:8px}
.rango{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
.rango .sortpick{flex:1;height:40px}.rango select{flex:1}
.num{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:12px;background:var(--glass);border:1px solid var(--gline);color:var(--tx);font:inherit;font-size:16px;outline:none}
.num:focus{border-color:var(--acc)}
body.sin-scroll{overflow:hidden}
/* guía de estilos */
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw > div{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px}
.sw i{width:34px;height:34px;border-radius:10px;flex:none;border:1px solid rgba(var(--ink),.15)}
.sw b{font-size:12px;font-weight:700;display:block}.sw small{font-size:11px;color:var(--mut)}
.tipo > div{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.tipo > div + div{border-top:1px solid rgba(var(--ink),.07)}
.tipo small{font-size:11px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px}
/* transiciones entre pantallas (View Transitions; si el navegador no las tiene, un fundido corto) */
#nav{view-transition-name:menu}
::view-transition-group(*){animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
html[data-dir=push]::view-transition-old(root){animation-name:vt-sale-izq}
html[data-dir=push]::view-transition-new(root){animation-name:vt-entra-der}
html[data-dir=pop]::view-transition-old(root){animation-name:vt-sale-der}
html[data-dir=pop]::view-transition-new(root){animation-name:vt-entra-izq}
html[data-dir=tab]::view-transition-old(root){animation:.18s ease both vt-fuera}
html[data-dir=tab]::view-transition-new(root){animation:.22s ease .04s both vt-dentro}
@keyframes vt-sale-izq{to{transform:translateX(-18%);opacity:0}}
@keyframes vt-entra-der{from{transform:translateX(28%);opacity:0}}
@keyframes vt-sale-der{to{transform:translateX(28%);opacity:0}}
@keyframes vt-entra-izq{from{transform:translateX(-18%);opacity:0}}
@keyframes vt-fuera{to{opacity:0}}
@keyframes vt-dentro{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/* modo claro */
:root[data-tema=claro]{--bg:#F2F3F6;--s1:#FFFFFF;--s2:#E8EAEF;--glass:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.95);--gline:rgba(20,24,32,.09);
  --tx:#14171D;--tx2:#3D4450;--mut:#6B7280;--acc:#0C9C97;--amb:#B5760A;--grn:#1F9256;--red:#D2483A;
  --ink:20,24,32;--bgrgb:242,243,246;--barrgb:255,255,255;--sh:rgba(20,24,32,.14);--bgtop:#FFFFFF;--chipb:#E4E6EB;--chipf:#4A5160}
:root[data-tema=claro] .chip{background:color-mix(in srgb,var(--cf,#888) 16%,#fff);color:color-mix(in srgb,var(--cf,#555) 50%,#000)}
:root[data-tema=claro] .hero-bg img{filter:blur(38px) saturate(1.2) brightness(1.1);opacity:.55}
:root[data-tema=claro] .sortpick select option{color:#000}
.row-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pill,.seg button,.capsule a,.tienda,.secbtn,.btn,.gbtn,.filtbtn,.tag.quita{transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .15s ease,opacity .2s ease}
.pill:active,.seg button:active,.capsule a:active,.tienda:active,.secbtn:active,.btn:active,.gbtn:active,.filtbtn:active{transform:scale(.95)}
.enciende{animation:enciende .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enciende{from{transform:scale(.86);opacity:.55}}
.capsule a svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.capsule a.on svg{transform:translateY(-1px) scale(1.06)}
.pill .n{opacity:.7;margin-left:4px}
.gbtn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--tx);text-decoration:none}
.sticky{position:sticky;top:0;z-index:5;background:rgba(var(--bgrgb),.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);margin:0 -16px;padding:calc(var(--st) + 10px) 16px 12px;border-bottom:1px solid rgba(var(--ink),.06);display:flex;flex-direction:column;gap:12px}
/* cabecera común (todas las pantallas) */
.wrap.pg{padding-top:0}
.cab{position:sticky;top:0;z-index:5;margin:0 -16px;padding:var(--st) 16px 12px;background:rgba(var(--bgrgb),.84);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid rgba(var(--ink),.06);display:flex;flex-direction:column;gap:12px}
.cab-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:54px}
.cab-l{justify-self:start;display:flex}.cab-r{justify-self:end;display:flex;align-items:center;gap:8px}
.cab-t{margin:0;font-size:16px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.cab.flota{position:fixed;left:0;right:0;max-width:560px;margin:0 auto;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:6px;transition:background .2s}
.cab.flota.solida{background:rgba(var(--bgrgb),.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid rgba(var(--ink),.06)}
.cab-mini{display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;font-weight:700;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;min-width:0}
.cab-mini img{height:40px;width:auto;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cab-mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab.flota.solida .cab-mini{opacity:1;transform:none}
.avatar-btn{display:block;width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--acc)}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.head{display:flex;align-items:center;gap:10px}
.head h1{flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:7px;height:44px;padding:0 6px 0 12px;border-radius:14px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .x{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--mut)}
.search input:placeholder-shown ~ .x{visibility:hidden}
.pill.cero{opacity:.45}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font:inherit;font-size:16px}
.search:focus-within{border-color:var(--acc)}
.seg{display:flex;border-radius:999px;padding:3px}
.seg button{width:38px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#0B1020}
.small-btn{min-height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:999px;font-size:13px;color:var(--tx)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;border-radius:20px;text-align:left;aspect-ratio:1/1}
.tile .img{flex:1;min-height:0;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.tile .img img{max-width:92%;max-height:100%;object-fit:contain}
.tile b{font-family:var(--font);font-size:15px;line-height:1.1}
.tile small{font-size:11px;color:var(--mut)}
/* cover */
.cov{position:relative;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--font);font-weight:800}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov.sm{width:46px;height:64px;border-radius:3px;font-size:13px}
.cov.xl{width:236px;height:331px;max-width:62vw;max-height:87vw;border-radius:4px;font-size:44px;transform-origin:50% 0;will-change:transform;box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 0 1px rgba(var(--ink),.08)}
/* game row */
.list{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.g{display:flex;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px;border-radius:16px;text-align:left}
.g .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.g .t{font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.g .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.money{font-weight:700;font-size:14px;color:var(--amb)}
.pos{color:var(--grn)} .neg{color:var(--red)}
/* estantería */
.shelf{position:relative;margin:0 -16px -60px;padding:34px 0 70px;min-height:calc(100vh - 230px);display:flex;flex-direction:column;gap:44px;
  background:linear-gradient(180deg,var(--bg) 0,rgba(18,21,27,0) 140px,rgba(18,21,27,0) calc(100% - 160px),var(--bg) 100%),radial-gradient(110% 60% at 50% 35%,#22252c 0%,#121418 60%,#08090b 100%)}
.shelf:before{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px}
:root[data-tema=claro] .shelf{background:linear-gradient(180deg,var(--bg) 0,rgba(242,243,246,0) 140px,rgba(242,243,246,0) calc(100% - 160px),var(--bg) 100%),radial-gradient(110% 60% at 50% 35%,#fbfbfc 0%,#e9ebef 60%,#d6d9df 100%)}
.shelf > div{position:relative}
.shelf .items{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:0 30px;align-items:end}
.balda{position:relative;height:36px;margin-top:-14px;z-index:1}
.balda i{position:absolute;display:block}
.balda .bt{left:0;right:0;top:0;height:24px;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.12))}
.balda .bc{left:0;right:0;top:24px;height:5px;background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.03));border-top:1px solid rgba(255,255,255,.32);border-radius:0 0 2px 2px}
.balda .bs{left:4%;right:4%;top:30px;height:26px;background:radial-gradient(60% 100% at 50% 0,rgba(0,0,0,.75),transparent)}
:root[data-tema=claro] .balda .bt{background:linear-gradient(180deg,rgba(20,24,32,.03),rgba(20,24,32,.10))}
:root[data-tema=claro] .balda .bc{background:linear-gradient(rgba(20,24,32,.12),rgba(20,24,32,.04));border-top-color:rgba(255,255,255,.95)}
:root[data-tema=claro] .balda .bs{background:radial-gradient(60% 100% at 50% 0,rgba(20,24,32,.25),transparent)}
.box{position:relative;width:100%;aspect-ratio:.712;border-radius:2px;display:grid;place-items:center;color:#fff;font-family:var(--font);font-weight:800;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 14px -6px rgba(0,0,0,.8)}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:2px}
.box img.refl{top:calc(100% + 1px);bottom:auto;transform:scaleY(-1);opacity:.22;pointer-events:none;
  clip-path:inset(calc(100% - 9px) 0 0 0);   /* visible solo los 9 px que hay hasta el canto de la balda */
  -webkit-mask-image:linear-gradient(to top,#000 0,transparent 9px);mask-image:linear-gradient(to top,#000 0,transparent 9px)}
:root[data-tema=claro] .box img.refl{opacity:.16}
.box .chip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:9px;padding:2px 6px;z-index:1}
/* ficha */
.hero{position:relative;max-width:560px;margin:0 auto;padding:calc(var(--st) + 58px) 16px 6px;text-align:center}
.hero-bg{position:fixed;left:0;right:0;top:0;height:78vh;overflow:hidden;z-index:0;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 35%,hsl(var(--h) 45% 32% / .9),transparent 75%);
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.hero-bg img{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(38px) saturate(1.35) brightness(.6)}
.hero > :not(.hero-bg){position:relative;z-index:1}
.detail{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.sortpick{position:relative;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 26px 0 12px;border-radius:14px;font-size:13px;color:var(--tx);flex:none}
.sortpick select{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--tx);font:inherit;font-weight:600;outline:none;padding:0}
.sortpick select option{color:#000}
.sortpick::after{content:'';position:absolute;right:12px;top:50%;width:4px;height:4px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:translateY(-75%) rotate(45deg);pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:rgba(var(--ink),.07);border:1px solid rgba(var(--ink),.10);color:var(--tx2)}
.tag svg{opacity:.8}
.hero-meta .tag{height:28px;padding:0 11px;font-size:13px;font-weight:500;gap:5px}
.hero .cov.xl{margin:2px auto 0}
.hero h1{margin:20px 0 12px;font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.hero-meta{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--tx2)}
.status i{width:8px;height:8px;border-radius:50%}
.nota{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px 0 10px;border-radius:999px;font-size:13px;font-weight:700;color:#1A1405;background:linear-gradient(180deg,#FFD36B,#F5B841);box-shadow:0 4px 14px rgba(245,184,65,.35)}
.nota small{font-weight:600;font-size:11px;opacity:.75;letter-spacing:.02em}
.hero .sub{margin:10px 0 0;color:var(--tx2);font-size:13px;line-height:1.5}
.detail{padding-top:8px}
.sec{margin-top:22px}
.sec > h2{margin:0 0 10px;font-size:15px;font-weight:600}
.vbig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end;padding:16px 0 14px;border-bottom:1px solid rgba(var(--ink),.08)}
.vbig > *{padding:0 16px}
.pclink{display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none}
.pclink span{display:inline-flex;align-items:center;gap:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid2{padding:6px 0}
.grid2 > div{padding:8px 16px;display:flex;flex-direction:column;gap:2px}
.grid2 > div > span{font-size:11px;color:var(--mut)}
.grid2 b{font-size:14px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:12px;padding:16px}
.barrow{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:12px;font-size:12px}
.bar{height:8px;background:rgba(var(--ink),.08);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.rows > div,.rows > a{display:flex;align-items:center;gap:14px;padding:12px 16px;color:inherit;text-decoration:none}
.rows > * + *{border-top:1px solid rgba(var(--ink),.07)}
.rows svg{flex:none;color:var(--tx2)}
.rows span{display:flex;flex-direction:column;gap:1px;font-size:13px}
.rows small{color:var(--mut);font-size:12px}
.tiendas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tterm{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;border-radius:12px;background:rgba(var(--ink),.06);border:1px solid var(--gline);color:var(--tx2)}
.tterm small{flex:none;font-size:11px;color:var(--tx2);padding:3px 8px;border-radius:999px;background:rgba(var(--ink),.08)}
.tterm input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px}
.tienda{display:flex;align-items:center;justify-content:center;height:46px;border-radius:14px;text-decoration:none;color:var(--tx);background:rgba(var(--ink),.08);border:1px solid rgba(var(--ink),.12)}
.tienda:active{background:rgba(var(--ink),.16)}
.tienda b{font-size:14px}
.tienda small{font-size:11px;color:var(--tx2)}
.clamp{padding:16px;font-size:13px;line-height:1.5;position:relative}
.clamp p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp.open p{-webkit-line-clamp:unset;display:block}
.clamp .mas{display:block;margin:8px 0 0 auto;padding:5px 12px;border-radius:999px;background:rgba(var(--ink),.08);font-weight:600;font-size:13px}
/* menú inferior flotante */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 14px 14px;pointer-events:none}
.navbar{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto}
.capsule{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:5px;border-radius:999px;background:rgba(var(--barrgb),.72);box-shadow:0 10px 30px var(--sh)}
.capsule a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:48px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--tx2);text-decoration:none}
.capsule a.on{background:rgba(var(--ink),.10);color:var(--acc)}
.circle{width:60px;height:60px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--tx);background:rgba(var(--barrgb),.72);box-shadow:0 10px 30px var(--sh)}
.circle.back{width:0;margin-left:-10px;opacity:0;border-width:0;overflow:hidden;transition:width .25s ease,margin .25s ease,opacity .2s ease}
.navbar.ficha .circle.back{width:60px;margin-left:0;opacity:1;border-width:1px}
.capsule{transition:all .25s ease}
/* formularios */
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--tx2)}
label.f input{height:50px;padding:0 14px;background:var(--glass);border:1px solid var(--gline);border-radius:14px;color:var(--tx);font:inherit;font-size:16px;outline:none}
label.f input:focus{border-color:var(--acc)}
.btn{height:46px;border-radius:999px;font-weight:700;font-size:14px;background:var(--acc);color:#0B1020;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec2{background:var(--glass2);color:var(--tx);border:1px solid var(--gline)}
.btn[disabled]{opacity:.5}
.empty{padding:48px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + var(--sb));z-index:20;max-width:528px;margin:0 auto;padding:14px 16px;background:var(--tx);color:var(--bg);border-radius:16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px var(--sh);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ptr{position:fixed;top:calc(var(--st) + 10px);left:50%;width:40px;height:40px;margin-left:-20px;border-radius:50%;display:grid;place-items:center;z-index:30;pointer-events:none;color:var(--tx2);background:rgba(var(--barrgb),.92);border:1px solid var(--gline);box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transform:translateY(-70px)}
#ptr.listo{color:var(--acc)}
#ptr.go svg{animation:spin .8s linear infinite}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav" hidden><div class="navbar">
  <div class="capsule">
    <a href="#/" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17.5 13.5h.01"/></svg>Colección</a>
    <a href="#/buscar" data-tab="buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Buscar</a>
    <a href="#/finanzas" data-tab="finanzas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4H5a2 2 0 0 0 0 4h14a1 1 0 0 1 1 1v3"/><path d="M3 6v12a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3"/><path d="M21 12v4h-4a2 2 0 0 1 0-4z"/></svg>Balance</a>
  </div>
</div></nav>
<div id="ptr" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ almacenamiento local (solo en este dispositivo) ============ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const S = {
  cfg: LS.get('rp.cfg', null),        // { url, key }
  data: LS.get('rp.data', null),      // respuesta del Apps Script
  ui: Object.assign({ view: 'rows', sort: 'hoja' }, LS.get('rp.ui', {})),
  filtro: {},                          // por consola: situación elegida
  q: {},                               // por consola: texto buscado
  gq: '',
  bf: { sits: [], consolas: [], formatos: [], parte: 'General', emin: '', emax: '', vmin: '', vmax: '', cmin: '', cmax: '', orden: 'hoja' }, // filtros de Buscar
  panel: false,
  cargando: false,
};
let IDX = { juegos: [], porId: {}, consolas: [], logos: {} };

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const eur = (v, d = 0) => isNum(v) ? v.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const nfmt = v => isNum(v) ? String(v).replace('.', ',') : (v === '' || v == null ? '—' : String(v));
const fecha = v => { if (!v) return '—'; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v); };
const isImg = u => typeof u === 'string' && /^https?:\/\//.test(u) && (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u) || /gstatic\.com\/images/.test(u));
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return Math.round((h * 137.508) % 360); };
const ini = t => (String(t).replace(/[^\p{L}\p{N} ]/gu, ' ').split(' ').filter(w => w && !/^(the|of|in|el|la|and|a)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('')) || '?';
const n = v => isNum(v) ? v : null;

const SIT = {
  'En colección': ['#1E3A2C', '#86E3AE'], 'En venta': ['#3D3016', '#F5C35B'], 'De camino': ['#33224A', '#D2B1FF'],
  'Me interesa': ['#1E2A47', '#A3BEFF'], 'Vendido': ['#2A2D33', '#C3C8D1'], 'En espera': ['#2E2A22', '#E2CFA3'],
  'Devolución': ['#45201E', '#FF9C90'], 'Especulación': ['#123536', '#7FE3DF'], 'Reservado': ['#3A2F22', '#E8C49A'],
};
const COL_NOTA = { 0.5: '#8F5A32', 1: '#BC5A38', 1.5: '#DB7B3A', 2: '#EDA844', 2.5: '#CFE24E', 3: '#AECF4C', 3.5: '#6FC443', 4: '#58B865', 4.5: '#4FA48C', 5: '#4C8FBF' };
const colNota = v => isNum(v) ? (COL_NOTA[Math.round(v * 2) / 2] || (v > 5 ? COL_NOTA[5] : COL_NOTA[0.5])) : 'transparent';
const chip = s => { const c = SIT[s] || ['#2A2D33', '#C3C8D1']; return `<span class="chip" style="--cb:${c[0]};--cf:${c[1]}">${esc(s)}</span>`; };
const coverBg = g => `background:hsl(${hue(g.ID)},38%,28%)`;
// Portada: primero la descargada de ScreenScraper (covers/map.json, en el propio repositorio); si no, la URL de la hoja
let PORTADAS = {};
// Las imágenes viven en la rama «portadas» (fuera de la web publicada, así cada cambio de la app se publica en segundos).
// Lista e imágenes se leen directamente de GitHub (siempre al día).
const RAMA_RAW = 'https://raw.githubusercontent.com/miguel-moya/retropi/portadas/';
const RAMA_CDN = RAMA_RAW; // (comprobado: GitHub sirve las imágenes con su tipo correcto)
try { PORTADAS = JSON.parse(localStorage.getItem('rp.portadas')) || {}; } catch (_) {}
fetch(RAMA_RAW + 'covers/map.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(m => {
  if (!m) return; const cambio = JSON.stringify(m) !== JSON.stringify(PORTADAS); PORTADAS = m;
  try { localStorage.setItem('rp.portadas', JSON.stringify(m)); } catch (_) {}
  if (cambio) render();
}).catch(() => {});
const urlMedia = (f, v) => f ? RAMA_CDN + f + (v ? '?v=' + v : '') : '';
const extras = g => { const p = PORTADAS[`${g._c}|${String(g['Título']).trim().toLowerCase()}`] || {};
  return { fondo: urlMedia(p.fondo, p.ssid), logo: urlMedia(p.logo, p.ssid), captura: urlMedia(p.captura, p.ssid) }; };
const portada = g => { const p = PORTADAS[`${g._c}|${String(g['Título']).trim().toLowerCase()}`]; return p && p.archivo ? urlMedia(p.archivo, p.ssid) : (isImg(g.Portada) ? g.Portada : ''); };
const cover = (g, cls) => `<span class="cov ${cls}" style="${coverBg(g)}">${esc(ini(g['Título']))}${portada(g) ? `<img loading="lazy" decoding="async" alt="" src="${esc(portada(g))}" onerror="this.remove()">` : ''}</span>`;
const plus = g => {
  const coste = n(g['Compra + Envío']);
  if (coste == null) return null;
  if (g['Situación'] === 'Vendido') return n(g['Venta']) == null ? null : g['Venta'] - coste;
  return n(g['Valor']) == null ? null : g['Valor'] - coste;
};
const signo = v => v == null ? '' : `<span class="${v < 0 ? 'neg' : 'pos'}">${v >= 0 ? '+' : ''}${eur(v)}</span>`;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function hace(iso) {
  if (!iso) return 'nunca';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora mismo'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}

/* ============ datos ============ */
function preparar() {
  const d = S.data; IDX = { juegos: [], porId: {}, consolas: [], logos: {} };
  if (!d || !d.consolas) return;
  (d.finanzas && d.finanzas.filas || []).forEach(f => { if (f['Sistema']) IDX.logos[f['Sistema']] = f['Logo']; });
  d.consolas.forEach(c => {
    const juegos = (c.juegos || []).map((g, i) => Object.assign(g, { _c: c.id, _cn: c.nombre, _i: i }));
    // situaciones en el orden en que aparecen en la hoja (= orden de bloques)
    const sits = []; juegos.forEach(g => { const s = g['Situación'] || 'Sin situación'; if (!sits.includes(s)) sits.push(s); });
    IDX.consolas.push(Object.assign({}, c, { juegos, sits, logo: IDX.logos[c.hoja] || '' }));
    juegos.forEach(g => { IDX.juegos.push(g); IDX.porId[g.ID] = g; });
  });
}

async function cargar(cfg, silencioso) {
  cfg = cfg || S.cfg; if (!cfg) return false;
  S.cargando = true; pintarEstado();
  try {
    const url = cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key);
    const r = await fetch(url, { cache: 'no-store', redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Respuesta no válida');
    S.data = j; LS.set('rp.data', j); preparar();
    if (!silencioso) toast('Datos actualizados');
    return true;
  } catch (e) {
    toast(/autorizado/i.test(e.message) ? 'Clave no válida' : 'No se pudo actualizar: ' + e.message);
    return false;
  } finally { S.cargando = false; render(); }
}

/* ============ vistas ============ */
const ICON = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  sync: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  sort: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>',
  rows: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  shelf: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M9 6v14M14 6v14M17.5 6.5l3.5 13"/></svg>',
  star: '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  sliders: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  ext: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>',
};
const SORTS = { hoja: 'Estado', valor: 'Valor', az: 'A–Z' };

// Cabecera común. Raíz (Colección, Buscar, Balance): título grande + avatar → Ajustes.
// Subpantallas (consola, ficha, ajustes): botón volver a la izquierda + título centrado.
function cab({ titulo = '', grande = false, volver = '', derecha = '', extra = '', flota = false }) {
  const izq = volver ? `<button class="gbtn" data-act="back" data-v="${esc(volver)}" aria-label="Volver">${ICON.back}</button>` : '';
  const der = derecha || (grande ? `<a class="avatar-btn" href="#/ajustes" aria-label="Ajustes"><img src="icons/avatar.jpg" alt=""></a>` : '');
  return `<header class="cab${flota ? ' flota' : ''}">
    <div class="cab-bar"><span class="cab-l">${izq}</span><h1 class="cab-t">${titulo}</h1><span class="cab-r">${der}</span></div>${extra}</header>`;
}

function vSetup() {
  const c = S.cfg || {};
  return `<div class="wrap stack" style="gap:22px">
    <header style="display:flex;align-items:center;gap:12px">
      <img src="icons/avatar.jpg" alt="" width="56" height="56" style="border-radius:50%;box-shadow:0 0 0 2px var(--acc)">
      <div><h1 class="disp" style="font-size:25px">Retro<span style="color:var(--acc)">Pi</span></h1><p class="muted" style="margin:4px 0 0">Conecta tu hoja</p></div>
    </header>

const PLAT = { megadrive: 'Mega Drive', mastersystem: 'Master System', nes: 'NES' };
const TERM = {}; // ajustes puntuales del término, solo en esta sesión
const VINTED_PLAT = { megadrive: 1285, mastersystem: 1285, nes: 1268 }; // Master System se publica en Mega Drive
const sinAcentos = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
function tUrls(nombre, c) {
  const plat = PLAT[c] || '';

/* ============ Buscar: búsqueda avanzada en toda la colección ============ */
const PARTES = ['General', 'Caja', 'Manual', 'Cartucho', 'Insert'];
const NOTAS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];
const ORDENES = { hoja: 'Orden de la hoja', 'estado-asc': 'Estado: peor primero', 'estado-desc': 'Estado: mejor primero',
  'valor-desc': 'Valor: mayor primero', 'valor-asc': 'Valor: menor primero', 'compra-desc': 'Compra + envío: mayor primero', az: 'A–Z' };
const numo = v => v === '' || v == null ? null : Number(String(v).replace(',', '.'));
function bfActivos() {
  const F = S.bf, out = [];
  F.sits.forEach(v => out.push(['sits', v, v]));
  F.consolas.forEach(v => out.push(['consolas', v, (IDX.consolas.find(c => c.id === v) || {}).nombre || v]));
  F.formatos.forEach(v => out.push(['formatos', v, v]));
  if (F.emin !== '' || F.emax !== '') out.push(['estado', '', `${F.parte} ${F.emin !== '' ? nfmt(+F.emin) : '0,5'}–${F.emax !== '' ? nfmt(+F.emax) : '5'}`]);
  if (F.vmin !== '' || F.vmax !== '') out.push(['valor', '', `Valor ${F.vmin || 0}–${F.vmax || '∞'} €`]);
  if (F.cmin !== '' || F.cmax !== '') out.push(['compra', '', `Compra ${F.cmin || 0}–${F.cmax || '∞'} €`]);
  return out;
}
function filtrarBusqueda() {
  const F = S.bf, q = S.gq.trim().toLowerCase();
  const kN = 'Estado ' + F.parte;
  const enRango = (v, a, b) => { a = numo(a); b = numo(b); if (a == null && b == null) return true; if (!isNum(v)) return false; return (a == null || v >= a) && (b == null || v <= b); };
  let l = IDX.juegos.filter(g =>
    (!q || String(g['Título']).toLowerCase().includes(q)) &&
    (!F.sits.length || F.sits.includes(g['Situación'])) &&
    (!F.consolas.length || F.consolas.includes(g._c)) &&
    (!F.formatos.length || F.formatos.includes(g['Formato'])) &&
    enRango(n(g[kN]), F.emin, F.emax) &&
    enRango(n(g['Valor']), F.vmin, F.vmax) &&
    enRango(n(g['Compra + Envío']), F.cmin, F.cmax));
  const val = (g, k) => { const v = n(g[k]); return isNum(v) ? v : null; };
  const por = (k, dir) => (a, b) => { const x = val(a, k), y = val(b, k); if (x == null) return 1; if (y == null) return -1; return dir * (x - y); };
  if (F.orden === 'estado-asc') l.sort(por(kN, 1)); else if (F.orden === 'estado-desc') l.sort(por(kN, -1));
  else if (F.orden === 'valor-desc') l.sort(por('Valor', -1)); else if (F.orden === 'valor-asc') l.sort(por('Valor', 1));
  else if (F.orden === 'compra-desc') l.sort(por('Compra + Envío', -1));
  else if (F.orden === 'az') l.sort((a, b) => String(a['Título']).localeCompare(String(b['Título']), 'es'));
  return l;
}
function vBuscar() {
  const sits = []; IDX.juegos.forEach(g => { if (g['Situación'] && !sits.includes(g['Situación'])) sits.push(g['Situación']); });
  const cuentas = contarSits(IDX.juegos, S.gq);
  const chips = sits.map(s => `<button class="pill ${S.bf.sits.includes(s) ? 'on' : ''} ${cuentas[s] ? '' : 'cero'}" data-act="bf" data-k="sits" data-v="${esc(s)}">${esc(s)}<span class="n">${cuentas[s] || 0}</span></button>`).join('');
  return `<div class="wrap pg">
    ${cab({ titulo: 'Buscar', grande: true, extra: `<div style="display:flex;gap:8px">
        <label class="search" style="flex:1;min-width:0">${ICON.search}<span class="sr">Buscar en toda la colección</span>
        <input id="qg" type="search" placeholder="Título, en todas las consolas" value="${esc(S.gq)}" autocomplete="off">${XBTN}</label>
        <button class="filtbtn glass" data-act="panel" aria-label="Filtros">${ICON.sliders}<span id="nfilt">${bfActivos().length || ''}</span></button></div>
      <div class="row-scroll">${chips}</div>` })}
    <div id="lista">${htmlBuscar()}</div>
    ${htmlPanel()}
  </div>`;
}
function htmlBuscar() {

  const salida = app.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${paso > 0 ? -48 : 48}px)`, opacity: 0 }], { duration: 160, easing: 'ease-in' });
  salida.onfinish = () => {
    history.replaceState(null, '', hashDe(ids[j]));
    render();
    const entrada = app.animate([{ transform: `translateX(${paso > 0 ? 48 : -48}px)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 220, easing: 'ease-out' });
    entrada.onfinish = () => { animando = false; };
  };
}
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { SW = null; return; }
  const t = e.touches[0]; if (t.clientX < 30) { BORDE_T = Date.now(); BORDE_HASH = location.hash; }
  SW = { x: t.clientX, y: t.clientY, t: Date.now(), borde: t.clientX < 24, enScroll: !!(e.target.closest && e.target.closest('.row-scroll, input, select')) };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!SW) return;
  const t = e.changedTouches[0], dx = t.clientX - SW.x, dy = t.clientY - SW.y, dt = Date.now() - SW.t, borde = SW.borde, enScroll = SW.enScroll; SW = null;
  const horizontal = Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && dt < 700;
  if (!horizontal) return;
  const b = document.querySelector('.cab [data-act="back"]');
  // si el sistema ya hace su propio «volver» con el gesto, no lo repetimos; si no lo hace (app instalada), volvemos nosotros
  if (borde && dx > 0 && b) { const h = location.hash; setTimeout(() => { if (location.hash === h) { GESTO_PROPIO = true; volver(b.dataset.v); } }, 350); return; }      // desde el borde: volver, como en iOS
  if (enScroll) return;
  if (ruta().a === 'j') irJuego(dx < 0 ? 1 : -1);                 // en la ficha: juego anterior / siguiente
  else if (ruta().a === 'c') irConsola(dx < 0 ? 1 : -1);          // en un listado: consola anterior / siguiente
  else if (ruta().a === 'b') irBalance(dx < 0 ? 1 : -1);          // en el detalle de Balance: consola anterior / siguiente
}, { passive: true });
document.addEventListener('keydown', e => { if (ruta().a === 'j' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) irJuego(e.key === 'ArrowRight' ? 1 : -1); });

/* ============ ficha: la portada se encoge al bajar ============ */
let rafFicha = 0;
function ajustarFicha() {
  rafFicha = 0;
  const cov = document.querySelector('.hero .cov.xl'), cabF = document.querySelector('.cab.flota');
  if (!cov || !cabF) return;
  const y = Math.max(0, window.scrollY), alto = cov.offsetHeight;
  const k = Math.min(1, y / (alto * 0.9));
  cov.style.transform = `translateY(${y * 0.35}px) scale(${1 - k * 0.45})`;
  cov.style.opacity = String(1 - Math.max(0, (k - 0.55) / 0.45));
  cabF.classList.toggle('solida', y > alto * 0.75);
}
window.addEventListener('scroll', () => { if (ruta().a === 'j' && !rafFicha) rafFicha = requestAnimationFrame(ajustarFicha); }, { passive: true });

/* ============ tema ============ */
const mqClaro = matchMedia('(prefers-color-scheme: light)');
function aplicarTema() {
  const t = S.ui.tema || 'auto', claro = t === 'claro' || (t === 'auto' && mqClaro.matches);
  document.documentElement.dataset.tema = claro ? 'claro' : 'oscuro';
  document.querySelector('meta[name=theme-color]').content = claro ? '#F2F3F6' : '#12151B';
}
mqClaro.addEventListener && mqClaro.addEventListener('change', aplicarTema);

/* ============ router ============ */
function ruta() { const h = location.hash.replace(/^#\/?/, ''); const [a, b] = h.split('/'); return { a: a || 'home', b: b ? decodeURIComponent(b) : '' }; }

const VISTAS = new Map();
function claveVista(r) {
  if (!r || !['c', 'buscar', 'home', 'finanzas', 'b'].includes(r.a)) return null;
  return JSON.stringify([r.a, r.b, S.data && S.data.generado, S.ui.view, S.ui.sort, S.filtro, S.q, S.gq, S.bf, Object.keys(PORTADAS).length, document.documentElement.dataset.tema]);
}
function render() {
  const r = ruta();
  const sinConfig = !S.cfg || r.a === 'conectar';
  let html;
  if (sinConfig) html = vSetup();
  else if (!S.data) html = `<div class="wrap"><div class="empty">${S.cargando ? 'Cargando tu colección…' : 'Sin datos. <button class="small-btn" data-act="sync" style="margin:12px auto 0">Reintentar</button>'}</div></div>`;
  else if (r.a === 'c') html = vConsola(r.b);
  else if (r.a === 'j') html = vJuego(r.b);
  else if (r.a === 'buscar') html = vBuscar();
  else if (r.a === 'finanzas') html = vFinanzas();
  else if (r.a === 'b') html = vBalanceConsola(r.b);
  else if (r.a === 'estilos') html = vEstilos();
  else if (r.a === 'ajustes') html = vAjustes();
  else html = vHome();
  if (r.a !== 'buscar') { S.panel = false; document.body.classList.remove('sin-scroll'); }
  const keepScroll = render._last === location.hash;
  const y = window.scrollY, app = $('#app');
  // Al salir de un listado se guarda tal cual (nodos y scroll); al volver se reutiliza: sin recargar portadas ni parpadeos.
  if (!keepScroll && render._last && claveVista(render._lastRuta)) {
    const frag = document.createDocumentFragment(); while (app.firstChild) frag.appendChild(app.firstChild);
    VISTAS.set(render._last, { clave: claveVista(render._lastRuta), frag, y, ctx: S.ctx });
  }
  const guardada = !keepScroll && VISTAS.get(location.hash);
  if (guardada && guardada.clave === claveVista(r)) {
    app.textContent = ''; app.appendChild(guardada.frag); S.ctx = guardada.ctx; VISTAS.delete(location.hash);
    window.scrollTo(0, guardada.y);
  } else {
    app.innerHTML = html;
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }
  render._lastRuta = r;
  render._last = location.hash;
  const nav = $('#nav'); nav.hidden = sinConfig;
  const tab = ['buscar', 'finanzas'].includes(r.a) ? r.a : r.a === 'b' ? 'finanzas' : 'home';
  nav.querySelectorAll('[data-tab]').forEach(a => { const era = a.classList.contains('on'), es = a.dataset.tab === tab; a.classList.toggle('on', es); if (es && !era) { a.classList.remove('enciende'); void a.offsetWidth; a.classList.add('enciende'); } });
  if (r.a === 'j') ajustarFicha();
  if (ULTIMO) { const b = document.querySelector(`[data-act="${ULTIMO.act}"][data-v="${CSS.escape(ULTIMO.v)}"]`); if (b) b.classList.add('enciende'); ULTIMO = null; }
}
let ULTIMO = null;
function pintarEstado() { if (ruta().a === 'home' || ruta().a === 'ajustes') render(); }

/* ============ eventos ============ */
document.addEventListener('click', e => {
  const enlace = e.target.closest('a.g, a.box');
  if (enlace) {
    document.querySelectorAll('[style*="view-transition-name"]').forEach(x => { if (x.id !== 'nav') x.style.viewTransitionName = ''; });
    const id = decodeURIComponent((enlace.getAttribute('href') || '').split('/').pop());
    S.vt = id; const c = enlace.querySelector('.cov') || enlace; c.style.viewTransitionName = 'portada';
  }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  if (['view', 'filtro', 'tema', 'bfparte'].includes(act)) ULTIMO = { act, v };   // para animar el botón recién activado
  if ((act === 'view' || act === 'filtro') && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.dataset.dir = 'tab';
    if (act === 'view') { S.ui.view = v; LS.set('rp.ui', S.ui); } else S.filtro[ruta().b] = v;
    document.startViewTransition(() => render()); return;
  }
  if (act === 'sync') { cargar(); }
  else if (act === 'filtro') { const id = ruta().b; S.filtro[id] = v; render(); }
  else if (act === 'bf') { const k = t.dataset.k, arr = S.bf[k]; const i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1);
    document.querySelectorAll(`[data-act="bf"][data-k="${k}"][data-v="${CSS.escape(v)}"]`).forEach(b => b.classList.toggle('on', arr.includes(v))); refrescarBuscar(); }
  else if (act === 'bfparte') { S.bf.parte = v; document.querySelectorAll('[data-act="bfparte"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); refrescarBuscar(); }
  else if (act === 'bfquita') { const k = t.dataset.k, F = S.bf;
    if (Array.isArray(F[k])) F[k] = F[k].filter(x => x !== v);
    else if (k === 'estado') { F.emin = ''; F.emax = ''; } else if (k === 'valor') { F.vmin = ''; F.vmax = ''; } else if (k === 'compra') { F.cmin = ''; F.cmax = ''; }
    render(); }
  else if (act === 'bflimpiar') { S.bf = { sits: [], consolas: [], formatos: [], parte: 'General', emin: '', emax: '', vmin: '', vmax: '', cmin: '', cmax: '', orden: 'hoja' }; render(); }
  else if (act === 'preset') { S.bf = Object.assign({ sits: [], consolas: [], formatos: [], parte: 'General', emin: '', emax: '', vmin: '', vmax: '', cmin: '', cmax: '', orden: 'hoja' }, JSON.parse(JSON.stringify(PRESETS[v]))); render(); }
  else if (act === 'panel') { S.panel = true; document.querySelector('.hoja-panel').classList.add('on'); document.querySelector('.velo').classList.add('on'); document.body.classList.add('sin-scroll'); }
  else if (act === 'panelcerrar') { S.panel = false; document.querySelector('.hoja-panel').classList.remove('on'); document.querySelector('.velo').classList.remove('on'); document.body.classList.remove('sin-scroll'); }
  else if (act === 'view') { S.ui.view = v; LS.set('rp.ui', S.ui); render(); }
  else if (act === 'mas') { const c = t.closest('.clamp'); c.classList.toggle('open'); t.textContent = c.classList.contains('open') ? 'Menos' : 'Más'; }
  else if (act === 'back') volver(v);
  else if (act === 'limpiar') { const i = t.closest('.search').querySelector('input'); i.value = ''; i.dispatchEvent(new Event('input', { bubbles: true })); i.focus(); }
  else if (act === 'tema') { S.ui.tema = v; LS.set('rp.ui', S.ui); aplicarTema(); render(); }
  else if (act === 'olvidar') { if (confirm('¿Olvidar la clave y los datos guardados en este dispositivo?')) { LS.del('rp.cfg'); LS.del('rp.data'); S.cfg = null; S.data = null; preparar(); location.hash = '#/'; render(); } }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.bf) { S.bf[e.target.dataset.bf] = e.target.value; refrescarBuscar(); return; }
  if (e.target.id === 'ssel') { S.ui.sort = e.target.value; LS.set('rp.ui', S.ui); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qc') { const id = e.target.dataset.c; S.q[id] = e.target.value; const c = IDX.consolas.find(x => x.id === id); $('#lista').innerHTML = htmlLista(c); pintarCuentas(c.juegos, S.q[id]); }
  else if (e.target.id === 'qg') { S.gq = e.target.value; refrescarBuscar(); pintarCuentas(IDX.juegos, S.gq); }
  else if (e.target.dataset && e.target.dataset.bf && e.target.tagName === 'INPUT') { S.bf[e.target.dataset.bf] = e.target.value; refrescarBuscar(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fsetup') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const cfg = { url: String(fd.get('url')).trim(), key: String(fd.get('key')).trim() };
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(cfg.url)) { toast('La URL debe ser la de script.google.com y terminar en /exec'); return; }
  S.cargando = true; render();
  const ok = await cargar(cfg, true);
  if (ok) { S.cfg = cfg; LS.set('rp.cfg', cfg); toast('Conectado'); location.hash = '#/'; render(); }
});
let PASOS = 0; // navegaciones dentro de la app (para saber si «volver» puede usar el historial)
const PROFUNDIDAD = a => ({ c: 1, b: 1, ajustes: 1, j: 2, estilos: 2 })[a] || 0;
let rutaPrevia = ruta().a;
window.addEventListener('hashchange', e => {
  PASOS++;
  const nueva = ruta().a, pa = PROFUNDIDAD(rutaPrevia), pn = PROFUNDIDAD(nueva); rutaPrevia = nueva;
  const dir = pn > pa ? 'push' : pn < pa ? 'pop' : 'tab';
  // si el propio navegador ya anima (gesto de volver de Safari), no se añade otra animación encima
  // gesto del sistema: ya anima él → sin animación propia. Gesto nuestro: misma animación que la flecha, sin viaje de portada.
  const propio = GESTO_PROPIO; GESTO_PROPIO = false;
  const porGesto = !propio && Date.now() - BORDE_T < 1500;
  if (propio) { document.querySelectorAll('[style*="view-transition-name"]').forEach(x => x.style.viewTransitionName = ''); S.vt = null; }
  if (porGesto) { document.querySelectorAll('[style*="view-transition-name"]').forEach(x => x.style.viewTransitionName = ''); S.vt = null; }
  if (e.hasUAVisualTransition || porGesto || !document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    render();
    if (!e.hasUAVisualTransition && !porGesto && !document.startViewTransition) $('#app').animate([{ opacity: 0, transform: `translateX(${dir === 'pop' ? -16 : dir === 'push' ? 16 : 0}px)` }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
    return;
  }
  document.documentElement.dataset.dir = dir;
  document.startViewTransition(() => render());
});
function volver(fallback) { if (PASOS > 0) { PASOS -= 2; history.back(); } else location.hash = fallback || '#/'; }

/* ============ deslizar hacia abajo para recargar la app ============ */
let PT = null;
const PTR_UMBRAL = 70;
function ptrPinta(d) {
  const el = $('#ptr');
  el.style.transition = d ? 'none' : 'transform .25s ease, opacity .25s ease';
  el.style.transform = `translateY(${d - 70}px) rotate(${d * 4}deg)`;
  el.style.opacity = Math.min(1, d / PTR_UMBRAL);
  el.classList.toggle('listo', d >= PTR_UMBRAL);
}
document.addEventListener('touchstart', e => {
  PT = (window.scrollY <= 0 && e.touches.length === 1) ? { x: e.touches[0].clientX, y: e.touches[0].clientY, d: 0 } : null;
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!PT) return;
  const dy = e.touches[0].clientY - PT.y, dx = e.touches[0].clientX - PT.x;
  if (PT.d === 0 && (dy <= 4 || Math.abs(dx) > dy)) { if (dy < 0 || Math.abs(dx) > 10) PT = null; return; }
  PT.d = Math.max(0, Math.min(dy * 0.55, 110)); ptrPinta(PT.d);
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!PT) return; const d = PT.d; PT = null;
  if (d < PTR_UMBRAL) { ptrPinta(0); return; }
  const el = $('#ptr'); el.classList.add('go'); el.style.transition = 'transform .2s ease'; el.style.transform = 'translateY(14px)';
  const sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}) : Promise.resolve();
  Promise.race([sw, new Promise(r => setTimeout(r, 1200))]).then(() => location.reload());
});

/* ============ arranque ============ */
aplicarTema();
// sin zoom con pellizco (iOS ignora user-scalable en Safari)
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
preparar();
render();
if (S.cfg) cargar(null, true);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // Los logos de consola se guardan en el dispositivo para que la portada salga al instante
  navigator.serviceWorker.ready.then(r => { const logos = IDX.consolas.map(c => c.logo).filter(Boolean); if (r.active && logos.length) r.active.postMessage({ logos }); });
}
</script>

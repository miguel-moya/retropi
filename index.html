<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetroPi">
<title>RetroPi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151B; --s1:#1A1E26; --s2:#252A34;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --gline:rgba(255,255,255,.10);
  --tx:#F2F3F5; --tx2:#C9CED6; --mut:#9AA1AE;
  --acc:#2AD8D2; --amb:#F5B841; --grn:#4FD18B; --red:#FF8A7A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 60% at 50% -10%,#1C2230 0%,var(--bg) 60%) fixed,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acc)}
img{display:block}
svg{pointer-events:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 20px) 16px calc(120px + var(--sb))}
.disp{font-family:var(--font);font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.05}
.eyebrow{margin:0;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:12px}
/* cristal */
.glass,.card,.g,.tile,.search,.pill,.small-btn,.seg,.gbtn,.capsule,.circle,.status{
  background:var(--glass);border:1px solid var(--gline);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.card{border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:#2A2D33;color:#C3C8D1}
.row-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pill .n{opacity:.7;margin-left:4px}
.gbtn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--tx);text-decoration:none}
.sticky{position:sticky;top:0;z-index:5;background:rgba(18,21,27,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);margin:0 -16px;padding:calc(var(--st) + 10px) 16px 12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:10px}
.head h1{flex:1;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font:inherit;font-size:16px}
.search:focus-within{border-color:var(--acc)}
.seg{display:flex;border-radius:999px;padding:3px}
.seg button{width:38px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#0B1020}
.small-btn{min-height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:999px;font-size:13px;color:var(--tx)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:12px;padding:10px 10px 14px;border-radius:20px;text-align:left}
.tile .img{height:86px;border-radius:14px;background:rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden}
.tile .img img{max-width:88%;max-height:84px;object-fit:contain}
.tile b{font-family:var(--font);font-size:15px;line-height:1.1}
.tile small{font-size:11px;color:var(--mut)}
/* cover */
.cov{position:relative;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--font);font-weight:800}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov.sm{width:46px;height:64px;border-radius:3px;font-size:13px}
.cov.xl{width:160px;height:222px;border-radius:3px;font-size:38px;box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
/* game row */
.list{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.g{display:flex;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px;border-radius:16px;text-align:left}
.g .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.g .t{font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.g .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.money{font-weight:700;font-size:14px;color:var(--amb)}
.pos{color:var(--grn)} .neg{color:var(--red)}
/* estantería */
.shelf{background:rgba(0,0,0,.22);margin:12px -16px 0;padding:22px 0 32px;display:flex;flex-direction:column;gap:26px}
.shelf .items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 22px;align-items:end}
.plank{height:12px;margin:0 10px;background:#6B4428;border-top:3px solid #8C5E3A;border-radius:2px;box-shadow:0 10px 18px rgba(0,0,0,.55)}
.box{position:relative;width:100%;aspect-ratio:.72;border-radius:3px 3px 1px 1px;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--font);font-weight:800;font-size:20px;box-shadow:inset 4px 0 0 rgba(0,0,0,.25),0 -2px 10px rgba(0,0,0,.35)}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.box .chip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:9px;padding:2px 6px;z-index:1}
/* ficha */
.hero{position:relative;max-width:560px;margin:0 auto;padding:calc(var(--st) + 12px) 16px 6px;text-align:center}
.hero-bg{position:fixed;left:0;right:0;top:0;height:78vh;overflow:hidden;z-index:0;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 35%,hsl(var(--h) 45% 32% / .9),transparent 75%);
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.hero-bg img{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(38px) saturate(1.35) brightness(.6)}
.hero > :not(.hero-bg){position:relative;z-index:1}
.detail{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.fontpick{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;font-size:12px;font-weight:700}
.fontpick select{background:none;border:0;color:var(--tx2);font:inherit;font-weight:600;outline:none;max-width:130px}
.fontpick select option{color:#000}
.hero .cov.xl{margin:2px auto 0}
.hero h1{margin:16px 0 10px;font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.hero-meta{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--tx2)}
.status i{width:8px;height:8px;border-radius:50%}
.nota{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px 0 10px;border-radius:999px;font-size:13px;font-weight:700;color:#1A1405;background:linear-gradient(180deg,#FFD36B,#F5B841);box-shadow:0 4px 14px rgba(245,184,65,.35)}
.nota small{font-weight:600;font-size:11px;opacity:.75;letter-spacing:.02em}
.hero .sub{margin:8px 0 0;color:var(--mut);font-size:13px;line-height:1.5}
.detail{padding-top:8px}
.sec{margin-top:22px}
.sec > h2{margin:0 0 10px;font-size:15px;font-weight:600}
.vbig{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid2{padding:6px 0}
.grid2 > div{padding:8px 16px;display:flex;flex-direction:column;gap:2px}
.grid2 span{font-size:11px;color:var(--mut)}
.grid2 b{font-size:14px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:12px;padding:16px}
.barrow{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:12px;font-size:12px}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.rows > div,.rows > a{display:flex;align-items:center;gap:14px;padding:12px 16px;color:inherit;text-decoration:none}
.rows > * + *{border-top:1px solid rgba(255,255,255,.07)}
.rows svg{flex:none;color:var(--tx2)}
.rows span{display:flex;flex-direction:column;gap:1px;font-size:13px}
.rows small{color:var(--mut);font-size:12px}
.tiendas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tterm{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--gline);color:var(--tx2)}
.tterm small{flex:none;font-size:11px;color:var(--tx2);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08)}
.tterm input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px}
.tienda{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;text-decoration:none;color:var(--tx);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tienda b{font-size:14px}
.tienda small{font-size:11px;color:var(--tx2)}
.clamp{padding:16px;font-size:13px;line-height:1.5;position:relative}
.clamp p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp.open p{-webkit-line-clamp:unset;display:block}
.clamp .mas{display:block;margin:8px 0 0 auto;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:600;font-size:13px}
/* menú inferior flotante */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 14px calc(10px + var(--sb));pointer-events:none}
.navbar{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;pointer-events:auto}
.capsule{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:5px;border-radius:999px;background:rgba(30,34,43,.72);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.capsule a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:48px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--tx2);text-decoration:none}
.capsule a.on{background:rgba(255,255,255,.10);color:var(--acc)}
.circle{width:60px;height:60px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--tx);background:rgba(30,34,43,.72);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.circle.back{width:0;margin-left:-10px;opacity:0;border-width:0;overflow:hidden;transition:width .25s ease,margin .25s ease,opacity .2s ease}
.navbar.ficha .circle.back{width:60px;margin-left:0;opacity:1;border-width:1px}
.capsule{transition:all .25s ease}
/* formularios */
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--tx2)}
label.f input{height:50px;padding:0 14px;background:var(--glass);border:1px solid var(--gline);border-radius:14px;color:var(--tx);font:inherit;font-size:16px;outline:none}
label.f input:focus{border-color:var(--acc)}
.btn{height:46px;border-radius:999px;font-weight:700;font-size:14px;background:var(--acc);color:#0B1020;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec2{background:var(--glass2);color:var(--tx);border:1px solid var(--gline)}
.btn[disabled]{opacity:.5}
.empty{padding:48px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + var(--sb));z-index:20;max-width:528px;margin:0 auto;padding:14px 16px;background:var(--tx);color:var(--bg);border-radius:16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav" hidden><div class="navbar">
  <div class="capsule">
    <a href="#/" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17.5 13.5h.01"/></svg>Colección</a>
    <a href="#/buscar" data-tab="buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Buscar</a>
    <a href="#/finanzas" data-tab="finanzas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M14 2.5A9 9 0 0 1 21.5 10H14z"/></svg>Finanzas</a>
  </div>
  <button class="circle back" data-act="back" aria-label="Volver" tabindex="-1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ almacenamiento local (solo en este dispositivo) ============ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const S = {
  cfg: LS.get('rp.cfg', null),        // { url, key }
  data: LS.get('rp.data', null),      // respuesta del Apps Script
  ui: Object.assign({ view: 'rows', sort: 'hoja' }, LS.get('rp.ui', {})),
  filtro: {},                          // por consola: situación elegida
  q: {},                               // por consola: texto buscado
  gq: '', gsit: '',
  cargando: false,
};
let IDX = { juegos: [], porId: {}, consolas: [], logos: {} };

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const eur = (v, d = 0) => isNum(v) ? v.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const nfmt = v => isNum(v) ? String(v).replace('.', ',') : (v === '' || v == null ? '—' : String(v));
const fecha = v => { if (!v) return '—'; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v); };
const isImg = u => typeof u === 'string' && /^https?:\/\//.test(u) && (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u) || /gstatic\.com\/images/.test(u));
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return Math.round((h * 137.508) % 360); };
const ini = t => (String(t).replace(/[^\p{L}\p{N} ]/gu, ' ').split(' ').filter(w => w && !/^(the|of|in|el|la|and|a)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('')) || '?';
const n = v => isNum(v) ? v : null;

const SIT = {
  'En colección': ['#1E3A2C', '#86E3AE'], 'En venta': ['#3D3016', '#F5C35B'], 'De camino': ['#33224A', '#D2B1FF'],
  'Me interesa': ['#1E2A47', '#A3BEFF'], 'Vendido': ['#2A2D33', '#C3C8D1'], 'En espera': ['#2E2A22', '#E2CFA3'],
  'Devolución': ['#45201E', '#FF9C90'], 'Especulación': ['#123536', '#7FE3DF'], 'Reservado': ['#3A2F22', '#E8C49A'],
};
const COL_NOTA = { 0.5: '#8F5A32', 1: '#BC5A38', 1.5: '#DB7B3A', 2: '#EDA844', 2.5: '#CFE24E', 3: '#AECF4C', 3.5: '#6FC443', 4: '#58B865', 4.5: '#4FA48C', 5: '#4C8FBF' };
const colNota = v => isNum(v) ? (COL_NOTA[Math.round(v * 2) / 2] || (v > 5 ? COL_NOTA[5] : COL_NOTA[0.5])) : 'transparent';
const chip = s => { const c = SIT[s] || ['#2A2D33', '#C3C8D1']; return `<span class="chip" style="background:${c[0]};color:${c[1]}">${esc(s)}</span>`; };
const coverBg = g => `background:hsl(${hue(g.ID)},38%,28%)`;
const cover = (g, cls) => `<span class="cov ${cls}" style="${coverBg(g)}">${esc(ini(g['Título']))}${isImg(g.Portada) ? `<img loading="lazy" decoding="async" alt="" src="${esc(g.Portada)}" onerror="this.remove()">` : ''}</span>`;
const plus = g => {
  const coste = n(g['Compra + Envío']);
  if (coste == null) return null;
  if (g['Situación'] === 'Vendido') return n(g['Venta']) == null ? null : g['Venta'] - coste;
  return n(g['Valor']) == null ? null : g['Valor'] - coste;
};
const signo = v => v == null ? '' : `<span class="${v < 0 ? 'neg' : 'pos'}">${v >= 0 ? '+' : ''}${eur(v)}</span>`;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function hace(iso) {
  if (!iso) return 'nunca';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora mismo'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}

/* ============ datos ============ */
function preparar() {
  const d = S.data; IDX = { juegos: [], porId: {}, consolas: [], logos: {} };
  if (!d || !d.consolas) return;
  (d.finanzas && d.finanzas.filas || []).forEach(f => { if (f['Sistema']) IDX.logos[f['Sistema']] = f['Logo']; });
  d.consolas.forEach(c => {
    const juegos = (c.juegos || []).map((g, i) => Object.assign(g, { _c: c.id, _cn: c.nombre, _i: i }));
    // situaciones en el orden en que aparecen en la hoja (= orden de bloques)
    const sits = []; juegos.forEach(g => { const s = g['Situación'] || 'Sin situación'; if (!sits.includes(s)) sits.push(s); });
    IDX.consolas.push(Object.assign({}, c, { juegos, sits, logo: IDX.logos[c.hoja] || '' }));
    juegos.forEach(g => { IDX.juegos.push(g); IDX.porId[g.ID] = g; });
  });
}

async function cargar(cfg, silencioso) {
  cfg = cfg || S.cfg; if (!cfg) return false;
  S.cargando = true; pintarEstado();
  try {
    const url = cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key);
    const r = await fetch(url, { cache: 'no-store', redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Respuesta no válida');
    S.data = j; LS.set('rp.data', j); preparar();
    if (!silencioso) toast('Datos actualizados');
    return true;
  } catch (e) {
    toast(/autorizado/i.test(e.message) ? 'Clave no válida' : 'No se pudo actualizar: ' + e.message);
    return false;
  } finally { S.cargando = false; render(); }
}

const PLAT = { megadrive: 'Mega Drive', mastersystem: 'Master System', nes: 'NES' };

const sinAcentos = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
function tUrls(nombre, c) {
  const plat = PLAT[c] || '', barato = !!S.ui.barato, vendidos = !!S.ui.vendidos;

  const sits = []; IDX.juegos.forEach(g => { if (g['Situación'] && !sits.includes(g['Situación'])) sits.push(g['Situación']); });
  const chips = sits.map(s => `<button class="pill ${S.gsit === s ? 'on' : ''}" data-act="gsit" data-v="${esc(s)}">${esc(s)}<span class="n">${IDX.juegos.filter(g => g['Situación'] === s).length}</span></button>`).join('');
  return `<div class="wrap" style="padding-top:0">
    <div class="sticky">
      <h1 class="disp" style="font-size:25px;margin-top:8px">Buscar</h1>
      <label class="search">${ICON.search}<span class="sr">Buscar en toda la colección</span>
        <input id="qg" type="search" placeholder="Título o comentario, en todas las consolas" value="${esc(S.gq)}" autocomplete="off"></label>
      <div class="row-scroll">${chips}</div>
    </div>
    <div id="lista">${htmlBuscar()}</div>
  </div>`;
}
function htmlBuscar() {
  const q = S.gq.trim().toLowerCase();
  if (!q && !S.gsit) return '<div class="empty">Busca en todas las consolas a la vez, también en vendidos y deseados.<br>O toca un filtro para ver, por ejemplo, todo lo que tienes en venta.</div>';
  let l = IDX.juegos;
  if (S.gsit) l = l.filter(g => g['Situación'] === S.gsit);
  if (q) l = l.filter(g => String(g['Título']).toLowerCase().includes(q) || String(g['Comentarios'] || '').toLowerCase().includes(q));
  S.ctx = l.slice(0, 150).map(g => g.ID);
  if (!l.length) return '<div class="empty">Sin resultados.</div>';
  const extra = l.length > 150 ? `<p class="muted" style="font-size:12px">Mostrando 150 de ${l.length}. Afina la búsqueda.</p>` : '';
  return '<div class="list">' + l.slice(0, 150).map(g => filaJuego(g, true)).join('') + '</div>' + extra;
}

function vFinanzas() {
  const f = S.data && S.data.finanzas;
  const filas = (f && f.filas) || [];
  const tot = k => filas.reduce((a, r) => a + (n(r[k]) || 0), 0);
  const card = r => `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:56px;height:40px;display:grid;place-items:center;flex:none">${r['Logo'] ? `<img loading="lazy" alt="" src="${esc(r['Logo'])}" style="max-width:56px;max-height:40px;object-fit:contain">` : ''}</span>
        <b style="flex:1;font-family:var(--font);font-size:18px">${esc(r['Sistema'])}</b>
        <span class="muted" style="font-size:13px">${esc(nfmt(r['Nº de juegos']))} juegos</span>
      </div>
      <div class="grid2" style="gap:8px;font-size:13px">
        <div><span class="muted">Valor colección</span><div class="money">${eur(n(r['Valor colección']))}</div></div>
        <div><span class="muted">Balance actual</span><div style="font-weight:700;font-size:16px">${signo(n(r['Inversión actual']))}</div></div>
        <div><span class="muted">Compras</span><div style="font-weight:600">${eur(n(r['Compras']))}</div></div>
        <div><span class="muted">Ventas</span><div style="font-weight:600">${eur(n(r['Ventas']))}</div></div>
      </div></div>`;
  return `<div class="wrap stack" style="gap:18px">
    <header><p class="eyebrow">Pestaña Finanzas · solo lectura</p><h1 class="disp" style="font-size:25px;margin-top:6px">Finanzas</h1></header>
    ${filas.length ? `<div class="card" style="padding:18px;display:flex;flex-direction:column;gap:6px">
      <span class="muted" style="font-size:13px">Valor de la colección</span>
      <div class="disp" style="font-size:30px;color:var(--amb)">${eur(tot('Valor colección'))}</div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--tx2)">
        <span>Compras ${eur(tot('Compras'))}</span><span>Ventas ${eur(tot('Ventas'))}</span><span>Balance ${signo(tot('Inversión actual'))}</span></div>
      <p class="muted" style="margin:6px 0 0;font-size:12px">Suma de las ${filas.length} consolas fiables de tu pestaña Finanzas. La app no recalcula nada: lee tus fórmulas.</p>
    </div>` : '<div class="empty">Sin datos de Finanzas.</div>'}
    ${filas.map(card).join('')}
  </div>`;
}

function vAjustes() {
  const u = S.cfg ? S.cfg.url : '';
  return `<div class="wrap stack" style="gap:18px">
    <h1 class="disp" style="font-size:25px">Ajustes</h1>
    <section class="stack" style="gap:10px">
      <h2 class="eyebrow">Tipografía · provisional</h2>
      <div class="card rows">${FUENTES.map(f => { cargarFuente(f); const on = (S.ui.font || 'Manrope') === f;
        return `<button data-act="fuente" data-v="${esc(f)}" style="text-align:left;width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;${on ? 'background:rgba(42,216,210,.10)' : ''}">
          <span style="font-family:'${esc(f)}',sans-serif;flex:1"><b style="font-size:17px;font-weight:700">${esc(f)}</b><small style="font-family:'${esc(f)}',sans-serif">Sonic The Hedgehog 2 · 95 € · 4,5</small></span>
          ${on ? '<span style="color:var(--acc);font-weight:700">✓</span>' : ''}</button>`; }).join('')}</div>
    </section>
    <div class="card" style="padding:16px;font-size:14px;line-height:1.6">
      <div class="muted" style="font-size:12px">Conectado a</div>
      <div style="word-break:break-all">${esc(u.replace(/(\/s\/.{6}).+(.{6}\/exec)/, '$1…$2'))}</div>
      <div class="muted" style="font-size:12px;margin-top:8px">Última actualización</div><div>${esc(hace(S.data && S.data.generado))}</div>
      <div class="muted" style="font-size:12px;margin-top:8px">Juegos cargados</div><div>${IDX.juegos.length}</div>
    </div>
    <button class="btn" data-act="sync">${S.cargando ? 'Actualizando…' : 'Actualizar ahora'}</button>
    <a class="btn sec2" href="#/conectar" style="text-decoration:none">Cambiar URL o clave</a>
    <button class="btn sec2" data-act="olvidar" style="color:var(--red)">Olvidar la clave en este dispositivo</button>
    <p class="muted" style="font-size:12px;line-height:1.5">La clave y la copia de tus datos se guardan solo en este dispositivo. RetroPi v5 · solo lectura.</p>
  </div>`;
}

const vNoEncontrado = () => `<div class="wrap"><div class="empty">No encontrado. <a href="#/">Volver al inicio</a></div></div>`;

/* ============ deslizar entre fichas ============ */
function contexto(g) {
  if (S.ctx && S.ctx.includes(g.ID)) return S.ctx;
  const c = IDX.consolas.find(x => x.id === g._c);
  S.ctx = c ? c.juegos.map(x => x.ID) : [g.ID];
  return S.ctx;
}
let SW = null, animando = false;
function irJuego(paso) {
  const cur = ruta().b, ids = S.ctx || [], i = ids.indexOf(cur), j = i + paso;
  const app = $('#app');
  if (animando) return;
  if (i < 0 || j < 0 || j >= ids.length) {   // tope: pequeño rebote
    app.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${paso > 0 ? -14 : 14}px)` }, { transform: 'translateX(0)' }], { duration: 220, easing: 'ease-out' });
    return;
  }
  animando = true;
  const salida = app.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${paso > 0 ? -48 : 48}px)`, opacity: 0 }], { duration: 160, easing: 'ease-in' });
  salida.onfinish = () => {
    history.replaceState(null, '', '#/j/' + encodeURIComponent(ids[j]));
    render();
    const entrada = app.animate([{ transform: `translateX(${paso > 0 ? 48 : -48}px)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 220, easing: 'ease-out' });
    entrada.onfinish = () => { animando = false; };
  };
}
document.addEventListener('touchstart', e => {
  if (ruta().a !== 'j' || e.touches.length !== 1) { SW = null; return; }
  const t = e.touches[0]; SW = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!SW || ruta().a !== 'j') return;
  const t = e.changedTouches[0], dx = t.clientX - SW.x, dy = t.clientY - SW.y, dt = Date.now() - SW.t; SW = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && dt < 700) irJuego(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', e => { if (ruta().a === 'j' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) irJuego(e.key === 'ArrowRight' ? 1 : -1); });

/* ============ tipografía (selector provisional) ============ */
const FUENTES = ['Manrope', 'Inter', 'DM Sans', 'Plus Jakarta Sans', 'Figtree', 'Geist', 'Onest'];
const cargadas = new Set(['Manrope']);
function cargarFuente(f) {
  if (cargadas.has(f)) return; cargadas.add(f);
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = `https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}:wght@400;500;600;700;800&display=swap`;
  document.head.appendChild(l);
}
function aplicarFuente(f) {
  if (!FUENTES.includes(f)) f = 'Manrope';
  cargarFuente(f);
  document.documentElement.style.setProperty('--font', `'${f}',system-ui,-apple-system,sans-serif`);
}

/* ============ router ============ */
function ruta() { const h = location.hash.replace(/^#\/?/, ''); const [a, b] = h.split('/'); return { a: a || 'home', b: b ? decodeURIComponent(b) : '' }; }

function render() {
  const r = ruta();
  const sinConfig = !S.cfg || r.a === 'conectar';
  let html;
  if (sinConfig) html = vSetup();
  else if (!S.data) html = `<div class="wrap"><div class="empty">${S.cargando ? 'Cargando tu colección…' : 'Sin datos. <button class="small-btn" data-act="sync" style="margin:12px auto 0">Reintentar</button>'}</div></div>`;
  else if (r.a === 'c') html = vConsola(r.b);
  else if (r.a === 'j') html = vJuego(r.b);
  else if (r.a === 'buscar') html = vBuscar();
  else if (r.a === 'finanzas') html = vFinanzas();
  else if (r.a === 'ajustes') html = vAjustes();
  else html = vHome();
  const keepScroll = render._last === location.hash;
  const y = window.scrollY;
  $('#app').innerHTML = html;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render._last = location.hash;
  const nav = $('#nav'); nav.hidden = sinConfig;
  nav.querySelector('.navbar').classList.toggle('ficha', r.a === 'j');
  nav.querySelector('.back').tabIndex = r.a === 'j' ? 0 : -1;
  const tab = ['buscar', 'finanzas'].includes(r.a) ? r.a : 'home';
  nav.querySelectorAll('[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
}
function pintarEstado() { if (ruta().a === 'home' || ruta().a === 'ajustes') render(); }

/* ============ eventos ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  if (act === 'sync') { cargar(); }
  else if (act === 'filtro') { const id = ruta().b; S.filtro[id] = v; render(); }
  else if (act === 'gsit') { S.gsit = S.gsit === v ? '' : v; $('#lista').innerHTML = htmlBuscar(); document.querySelectorAll('[data-act="gsit"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.gsit)); }
  else if (act === 'sort') { const k = Object.keys(SORTS); S.ui.sort = k[(k.indexOf(S.ui.sort) + 1) % k.length]; LS.set('rp.ui', S.ui); render(); }
  else if (act === 'view') { S.ui.view = v; LS.set('rp.ui', S.ui); render(); }
  else if (act === 'fuente') { S.ui.font = v; LS.set('rp.ui', S.ui); aplicarFuente(v); render(); toast('Fuente: ' + v); }
  else if (act === 'opt') { S.ui[v] = !S.ui[v]; LS.set('rp.ui', S.ui); render(); }
  else if (act === 'mas') { const c = t.closest('.clamp'); c.classList.toggle('open'); t.textContent = c.classList.contains('open') ? 'Menos' : 'Más'; }
  else if (act === 'back') { if (history.length > 1) history.back(); else location.hash = '#/'; }
  else if (act === 'olvidar') { if (confirm('¿Olvidar la clave y los datos guardados en este dispositivo?')) { LS.del('rp.cfg'); LS.del('rp.data'); S.cfg = null; S.data = null; preparar(); location.hash = '#/'; render(); } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fsel') { S.ui.font = e.target.value; LS.set('rp.ui', S.ui); aplicarFuente(e.target.value); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qc') { const id = e.target.dataset.c; S.q[id] = e.target.value; const c = IDX.consolas.find(x => x.id === id); $('#lista').innerHTML = htmlLista(c); }
  else if (e.target.id === 'qg') { S.gq = e.target.value; $('#lista').innerHTML = htmlBuscar(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fsetup') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const cfg = { url: String(fd.get('url')).trim(), key: String(fd.get('key')).trim() };
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(cfg.url)) { toast('La URL debe ser la de script.google.com y terminar en /exec'); return; }
  S.cargando = true; render();
  const ok = await cargar(cfg, true);
  if (ok) { S.cfg = cfg; LS.set('rp.cfg', cfg); toast('Conectado'); location.hash = '#/'; render(); }
});
window.addEventListener('hashchange', render);

/* ============ arranque ============ */
aplicarFuente(S.ui.font || 'Manrope');
preparar();
render();
if (S.cfg) cargar(null, true);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetroPi">
<title>RetroPi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --s1:#171A21; --s2:#20242D; --line:#262B35; --line2:#22262F;
  --tx:#F2F3F5; --tx2:#C9CED6; --mut:#9AA1AE;
  --acc:#2AD8D2; --amb:#F5B841; --grn:#4FD18B; --red:#FF8A7A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acc)}
img{display:block}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 20px) 16px calc(100px + var(--sb))}
.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
.eyebrow{margin:0;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#2A2D33;color:#C3C8D1}
.row-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--s1);color:var(--tx2);border:1px solid var(--line);white-space:nowrap}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pill .n{opacity:.7;margin-left:4px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconbtn svg,.nav svg{pointer-events:none}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(var(--st) + 10px) 16px 12px;border-bottom:1px solid #1C2029;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:6px}
.head h1{flex:1;font-size:26px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font:inherit;font-size:16px}
.search:focus-within{border-color:var(--acc)}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{width:38px;height:30px;display:grid;place-items:center;border-radius:999px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#0B1020}
.small-btn{min-height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;font-size:13px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:12px;padding:10px 10px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left}
.tile .img{height:96px;border-radius:12px;background:#0E1014;display:grid;place-items:center;overflow:hidden}
.tile .img img{max-width:88%;max-height:84px;object-fit:contain}
.tile b{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;line-height:1.1}
.tile small{font-size:12px;color:var(--mut)}
/* cover */
.cov{position:relative;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov.sm{width:52px;height:72px;border-radius:8px;font-size:15px}
.cov.lg{width:132px;height:182px;border-radius:12px;font-size:30px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
/* game row */
.list{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.g{display:flex;gap:14px;align-items:center;width:100%;padding:10px 12px 10px 10px;background:var(--s1);border:1px solid var(--line2);border-radius:16px;text-align:left}
.g .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.g .t{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.g .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.money{font-weight:700;font-size:16px;color:var(--amb)}
.pos{color:var(--grn)} .neg{color:var(--red)}
/* shelf */
.shelf{background:#121419;margin:12px -16px 0;padding:22px 0 32px;display:flex;flex-direction:column;gap:26px}
.shelf .items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 22px;align-items:end}
.plank{height:12px;margin:0 10px;background:#6B4428;border-top:3px solid #8C5E3A;border-radius:2px;box-shadow:0 10px 18px rgba(0,0,0,.55)}
.box{position:relative;width:100%;aspect-ratio:.72;border-radius:3px 3px 1px 1px;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;box-shadow:inset 4px 0 0 rgba(0,0,0,.25),0 -2px 10px rgba(0,0,0,.35)}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.box .chip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:9px;padding:2px 6px;z-index:1}
/* detail */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{padding:14px;display:flex;flex-direction:column;gap:4px}
.kv span{font-size:12px;color:var(--mut)}
.kv b{font-size:18px}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:84px 1fr 36px;align-items:center;gap:12px;font-size:14px}
.bar{height:8px;background:#22262F;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.sec{margin-top:22px}
.sec h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(18,20,26,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #1C2029;padding:6px 12px calc(10px + var(--sb))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:12px;font-weight:600;color:#7D8492;text-decoration:none}
.nav a.on{color:var(--tx)}
.nav a.on svg{color:var(--acc)}
/* forms */
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--tx2)}
label.f input{height:50px;padding:0 14px;background:var(--s1);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;outline:none}
label.f input:focus{border-color:var(--acc)}
.btn{height:52px;border-radius:14px;font-weight:700;font-size:16px;background:var(--acc);color:#0B1020;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec2{background:var(--s2);color:var(--tx)}
.btn[disabled]{opacity:.5}
.empty{padding:48px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + var(--sb));z-index:20;max-width:528px;margin:0 auto;padding:14px 16px;background:var(--tx);color:var(--bg);border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav" hidden><div>
  <a href="#/" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17.5 13.5h.01"/></svg>Colección</a>
  <a href="#/buscar" data-tab="buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Buscar</a>
  <a href="#/finanzas" data-tab="finanzas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Finanzas</a>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ almacenamiento local (solo en este dispositivo) ============ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const S = {
  cfg: LS.get('rp.cfg', null),        // { url, key }
  data: LS.get('rp.data', null),      // respuesta del Apps Script
  ui: Object.assign({ view: 'rows', sort: 'hoja' }, LS.get('rp.ui', {})),
  filtro: {},                          // por consola: situación elegida
  q: {},                               // por consola: texto buscado
  gq: '', gsit: '',
  cargando: false,
};
let IDX = { juegos: [], porId: {}, consolas: [], logos: {} };

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const eur = (v, d = 0) => isNum(v) ? v.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const nfmt = v => isNum(v) ? String(v).replace('.', ',') : (v === '' || v == null ? '—' : String(v));
const fecha = v => { if (!v) return '—'; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v); };
const isImg = u => typeof u === 'string' && /^https?:\/\//.test(u) && (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u) || /gstatic\.com\/images/.test(u));
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return Math.round((h * 137.508) % 360); };
const ini = t => (String(t).replace(/[^\p{L}\p{N} ]/gu, ' ').split(' ').filter(w => w && !/^(the|of|in|el|la|and|a)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('')) || '?';
const n = v => isNum(v) ? v : null;

const SIT = {
  'En colección': ['#1E3A2C', '#86E3AE'], 'En venta': ['#3D3016', '#F5C35B'], 'De camino': ['#33224A', '#D2B1FF'],
  'Me interesa': ['#1E2A47', '#A3BEFF'], 'Vendido': ['#2A2D33', '#C3C8D1'], 'En espera': ['#2E2A22', '#E2CFA3'],
  'Devolución': ['#45201E', '#FF9C90'], 'Especulación': ['#123536', '#7FE3DF'], 'Reservado': ['#3A2F22', '#E8C49A'],
};
const chip = s => { const c = SIT[s] || ['#2A2D33', '#C3C8D1']; return `<span class="chip" style="background:${c[0]};color:${c[1]}">${esc(s)}</span>`; };
const coverBg = g => `background:hsl(${hue(g.ID)},38%,28%)`;
const cover = (g, cls) => `<span class="cov ${cls}" style="${coverBg(g)}">${esc(ini(g['Título']))}${isImg(g.Portada) ? `<img loading="lazy" decoding="async" alt="" src="${esc(g.Portada)}" onerror="this.remove()">` : ''}</span>`;
const plus = g => {
  const coste = n(g['Compra + Envío']);
  if (coste == null) return null;
  if (g['Situación'] === 'Vendido') return n(g['Venta']) == null ? null : g['Venta'] - coste;
  return n(g['Valor']) == null ? null : g['Valor'] - coste;
};
const signo = v => v == null ? '' : `<span class="${v < 0 ? 'neg' : 'pos'}">${v >= 0 ? '+' : ''}${eur(v)}</span>`;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function hace(iso) {
  if (!iso) return 'nunca';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora mismo'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}

/* ============ datos ============ */
function preparar() {
  const d = S.data; IDX = { juegos: [], porId: {}, consolas: [], logos: {} };
  if (!d || !d.consolas) return;
  (d.finanzas && d.finanzas.filas || []).forEach(f => { if (f['Sistema']) IDX.logos[f['Sistema']] = f['Logo']; });
  d.consolas.forEach(c => {
    const juegos = (c.juegos || []).map((g, i) => Object.assign(g, { _c: c.id, _cn: c.nombre, _i: i }));
    // situaciones en el orden en que aparecen en la hoja (= orden de bloques)
    const sits = []; juegos.forEach(g => { const s = g['Situación'] || 'Sin situación'; if (!sits.includes(s)) sits.push(s); });
    IDX.consolas.push(Object.assign({}, c, { juegos, sits, logo: IDX.logos[c.hoja] || '' }));
    juegos.forEach(g => { IDX.juegos.push(g); IDX.porId[g.ID] = g; });
  });
}

async function cargar(cfg, silencioso) {
  cfg = cfg || S.cfg; if (!cfg) return false;
  S.cargando = true; pintarEstado();
  try {
    const url = cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key);
    const r = await fetch(url, { cache: 'no-store', redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Respuesta no válida');
    S.data = j; LS.set('rp.data', j); preparar();
    if (!silencioso) toast('Datos actualizados');
    return true;
  } catch (e) {
    toast(/autorizado/i.test(e.message) ? 'Clave no válida' : 'No se pudo actualizar: ' + e.message);
    return false;
  } finally { S.cargando = false; render(); }
}

/* ============ vistas ============ */
const ICON = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  sync: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg>',
  gear: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1AE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  sort: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>',
  rows: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  shelf: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M3 11h18M5 11V4h3v7M10 11V5h3v6M15 11l1.5-6 3 .8L18 11M5 20v-6h3v6M10 20v-7h3v7M15 20v-5h3v5"/></svg>',
  ext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
};
const SORTS = { hoja: 'Orden hoja', valor: 'Valor', az: 'A–Z' };

function vSetup() {
  const c = S.cfg || {};
  return `<div class="wrap stack" style="gap:22px">
    <header style="display:flex;align-items:center;gap:12px">
      <img src="icons/avatar.jpg" alt="" width="56" height="56" style="border-radius:50%;box-shadow:0 0 0 2px var(--acc)">
      <div><h1 class="disp" style="font-size:32px">Retro<span style="color:var(--acc)">Pi</span></h1><p class="muted" style="margin:4px 0 0">Conecta tu hoja</p></div>
    </header>
    <p class="muted" style="margin:0;line-height:1.5">Pega la URL de tu Apps Script (la que termina en <b>/exec</b>) y tu clave. Se guardan <b>solo en este dispositivo</b>.</p>
    <form id="fsetup" class="stack" style="gap:16px" autocomplete="off">
      <label class="f">URL de la aplicación web<input name="url" type="url" inputmode="url" required placeholder="https://script.google.com/macros/s/…/exec" value="${esc(c.url || '')}"></label>
      <label class="f">Clave<input name="key" type="password" required autocomplete="off" spellcheck="false" value="${esc(c.key || '')}"></label>
      <button class="btn" type="submit" ${S.cargando ? 'disabled' : ''}>${S.cargando ? 'Conectando…' : 'Conectar'}</button>
      ${S.cfg ? '<a class="btn sec2" href="#/" style="text-decoration:none">Cancelar</a>' : ''}
    </form>
  </div>`;
}

function vHome() {
  const g = S.data && S.data.generado;
  const tiles = IDX.consolas.map(c => {
    const nCol = c.juegos.filter(j => j['Situación'] === 'En colección').length;
    return `<a class="tile" href="#/c/${esc(c.id)}" style="text-decoration:none;color:inherit">
      <span class="img">${c.logo ? `<img loading="lazy" alt="" src="${esc(c.logo)}">` : ''}</span>
      <span style="display:flex;flex-direction:column;gap:2px"><b>${esc(c.nombre)}</b><small>${nCol} en colección</small></span></a>`;
  }).join('');
  return `<div class="wrap stack" style="gap:22px">
    <header style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="icons/avatar.jpg" alt="Avatar de RetroPi" width="52" height="52" style="border-radius:50%;box-shadow:0 0 0 2px var(--acc)">
        <div><h1 class="disp" style="font-size:32px">Retro<span style="color:var(--acc)">Pi</span></h1><p class="muted" style="margin:4px 0 0;font-size:13px">Mi colección</p></div>
      </div>
      <a class="iconbtn" href="#/ajustes" aria-label="Ajustes" style="color:var(--mut)">${ICON.gear}</a>
    </header>
    <button class="small-btn" data-act="sync" style="align-self:flex-start;color:var(--mut)">
      <span class="${S.cargando ? 'spin' : ''}" style="display:grid">${ICON.sync}</span>
      ${S.cargando ? 'Actualizando…' : 'Actualizado ' + hace(g)}</button>
    <section class="stack"><h2 class="eyebrow">Consolas</h2><div class="tiles">${tiles || '<p class="muted">Sin datos todavía.</p>'}</div></section>
  </div>`;
}

function juegosFiltrados(c) {
  const sit = S.filtro[c.id] || (c.sits.includes('En colección') ? 'En colección' : 'Todos');
  const q = (S.q[c.id] || '').trim().toLowerCase();
  let l = c.juegos;
  if (sit !== 'Todos') l = l.filter(g => (g['Situación'] || 'Sin situación') === sit);
  if (q) l = l.filter(g => String(g['Título']).toLowerCase().includes(q) || String(g['Comentarios'] || '').toLowerCase().includes(q));
  l = l.slice();
  if (S.ui.sort === 'valor') l.sort((a, b) => (n(b['Situación'] === 'Vendido' ? b['Venta'] : b['Valor']) || 0) - (n(a['Situación'] === 'Vendido' ? a['Venta'] : a['Valor']) || 0));
  else if (S.ui.sort === 'az') l.sort((a, b) => String(a['Título']).localeCompare(String(b['Título']), 'es'));
  return { l, sit };
}

function filaJuego(g, conConsola) {
  const p = plus(g); const vend = g['Situación'] === 'Vendido';
  return `<a class="g" href="#/j/${esc(g.ID)}" style="text-decoration:none;color:inherit">
    ${cover(g, 'sm')}
    <span class="mid"><span class="t">${esc(g['Título'])}</span>
      <span class="meta">${chip(g['Situación'])}${conConsola ? `<span>${esc(g._cn)}</span>` : ''}${g['Formato'] ? `<span>${esc(g['Formato'])}</span>` : ''}${n(g['Estado General']) != null ? `<span>· ${nfmt(g['Estado General'])}</span>` : ''}</span></span>
    <span class="end"><span class="money">${eur(vend ? g['Venta'] : g['Valor'])}</span><small style="font-size:12px;font-weight:600">${signo(p)}</small></span></a>`;
}

function htmlLista(c) {
  const { l } = juegosFiltrados(c);
  if (!l.length) return '<div class="empty">Nada con este filtro.</div>';
  if (S.ui.view === 'shelf') {
    let out = '<div class="shelf">';
    for (let i = 0; i < l.length; i += 3) {
      out += '<div><div class="items">' + l.slice(i, i + 3).map(g => `<a class="box" href="#/j/${esc(g.ID)}" aria-label="${esc(g['Título'])}" style="${coverBg(g)};text-decoration:none">${esc(ini(g['Título']))}${isImg(g.Portada) ? `<img loading="lazy" decoding="async" alt="" src="${esc(g.Portada)}" onerror="this.remove()">` : ''}${g['Situación'] !== 'En colección' ? chip(g['Situación']) : ''}</a>`).join('') + '</div><div class="plank" aria-hidden="true"></div></div>';
    }
    return out + '</div>';
  }
  return '<div class="list">' + l.map(g => filaJuego(g, false)).join('') + '</div>';
}

function vConsola(id) {
  const c = IDX.consolas.find(x => x.id === id);
  if (!c) return vNoEncontrado();
  const { sit } = juegosFiltrados(c);
  const chips = ['Todos', ...c.sits].map(s => {
    const cnt = s === 'Todos' ? c.juegos.length : c.juegos.filter(g => (g['Situación'] || 'Sin situación') === s).length;
    return `<button class="pill ${s === sit ? 'on' : ''}" data-act="filtro" data-v="${esc(s)}">${esc(s)}<span class="n">${cnt}</span></button>`;
  }).join('');
  return `<div class="wrap" style="padding-top:0">
    <div class="sticky">
      <div class="head">
        <a class="iconbtn" href="#/" aria-label="Volver" style="margin-left:-10px;color:inherit">${ICON.back}</a>
        <h1 class="disp">${esc(c.nombre)}</h1>
        <div class="seg" role="group" aria-label="Vista">
          <button class="${S.ui.view === 'rows' ? 'on' : ''}" data-act="view" data-v="rows" aria-label="Lista">${ICON.rows}</button>
          <button class="${S.ui.view === 'shelf' ? 'on' : ''}" data-act="view" data-v="shelf" aria-label="Estantería">${ICON.shelf}</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <label class="search" style="flex:1;min-width:0">${ICON.search}<span class="sr">Buscar en ${esc(c.nombre)}</span>
          <input id="qc" data-c="${esc(c.id)}" type="search" placeholder="Buscar" value="${esc(S.q[c.id] || '')}" autocomplete="off"></label>
        <button class="small-btn" data-act="sort" style="height:46px;border-radius:14px" aria-label="Ordenar: ${SORTS[S.ui.sort]}">${ICON.sort}${SORTS[S.ui.sort]}</button>
      </div>
      <div class="row-scroll">${chips}</div>
    </div>
    <div id="lista">${htmlLista(c)}</div>
  </div>`;
}

function vJuego(gid) {
  const g = IDX.porId[gid];
  if (!g) return vNoEncontrado();
  const p = plus(g); const vend = g['Situación'] === 'Vendido';
  const kv = (k, v, cls) => `<div class="card kv"><span>${k}</span><b class="${cls || ''}">${v}</b></div>`;
  const money = [
    kv('Compra', eur(g['Compra'], 2)),
    kv('Compra + envío', eur(g['Compra + Envío'], 2)),
  ];
  if (vend || n(g['Venta']) != null) money.push(kv('Venta', eur(g['Venta'], 2)));
  if (g['Fecha venta']) money.push(kv('Fecha venta', fecha(g['Fecha venta'])));
  money.push(kv(vend ? 'Beneficio' : 'Plusvalía', p == null ? '—' : (p >= 0 ? '+' : '') + eur(p, 2), p == null ? '' : (p < 0 ? 'neg' : 'pos')));
  const estados = Object.keys(g).filter(k => /^Estado /.test(k) && k !== 'Estado General').concat(g['Estado General'] !== undefined ? ['Estado General'] : []);
  const bars = estados.map(k => { const v = g[k]; const pct = isNum(v) ? Math.max(0, Math.min(100, v / 5 * 100)) : 0;
    return `<div class="barrow"><span class="muted" style="color:var(--tx2)">${esc(k.replace('Estado ', ''))}</span><span class="bar"><i style="width:${pct}%;${isNum(v) && v < 4 ? 'background:var(--amb)' : ''}"></i></span><b style="text-align:right">${esc(nfmt(v))}</b></div>`; }).join('');
  const otras = IDX.juegos.filter(x => x._c === g._c && x.ID !== g.ID && String(x['Título']).toLowerCase() === String(g['Título']).toLowerCase());
  const pcVal = n(g['Valor Price Charting']);
  return `<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:-10px">
      <button class="iconbtn" data-act="back" aria-label="Volver" style="margin-left:-10px">${ICON.back}</button>
      <span class="muted" style="font-size:13px">${esc(g._cn)} · ${esc(g.ID)}</span><span style="width:44px"></span>
    </div>
    <div style="display:flex;gap:18px;align-items:flex-end;margin-top:8px">
      ${cover(g, 'lg')}
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding-bottom:6px">
        <h1 class="disp" style="font-size:25px">${esc(g['Título'])}</h1>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${chip(g['Situación'])}${g['Región'] ? `<span class="chip">${esc(g['Región'])}</span>` : ''}${g['Formato'] ? `<span class="chip">${esc(g['Formato'])}</span>` : ''}</div>
      </div>
    </div>
    <div class="card" style="margin-top:22px;padding:16px;display:flex;justify-content:space-between;align-items:flex-end">
      <div><span class="muted" style="font-size:12px">Tu valor</span><div class="disp" style="font-size:36px;color:var(--amb)">${eur(g['Valor'])}</div></div>
      ${pcVal != null ? `<div style="text-align:right"><span class="muted" style="font-size:12px">PriceCharting</span><div style="font-size:17px;font-weight:600">${eur(pcVal, 2)}</div></div>` : ''}
    </div>
    <div class="grid2" style="margin-top:10px">${money.join('')}</div>
    ${bars ? `<section class="sec"><h2>Estado</h2><div class="bars">${bars}</div></section>` : ''}
    ${g['Comentarios'] ? `<section class="sec"><h2>Comentarios</h2><div class="card" style="padding:14px 16px;font-size:14px;line-height:1.5">${esc(g['Comentarios'])}</div></section>` : ''}
    ${otras.length ? `<section class="sec"><h2>Otras unidades de este juego</h2><div class="list" style="padding-top:0">${otras.map(x => filaJuego(x, false)).join('')}</div></section>` : ''}
    ${g['Url Price Charting'] ? `<p style="margin-top:22px"><a href="${esc(g['Url Price Charting'])}" target="_blank" rel="noopener" style="display:inline-flex;gap:6px;align-items:center;font-size:14px">Ver en PriceCharting ${ICON.ext}</a></p>` : ''}
    <p class="muted" style="font-size:12px;margin-top:18px">Versión de solo lectura: para editar, usa la hoja.</p>
  </div>`;
}

function vBuscar() {
  const sits = []; IDX.juegos.forEach(g => { if (g['Situación'] && !sits.includes(g['Situación'])) sits.push(g['Situación']); });
  const chips = sits.map(s => `<button class="pill ${S.gsit === s ? 'on' : ''}" data-act="gsit" data-v="${esc(s)}">${esc(s)}<span class="n">${IDX.juegos.filter(g => g['Situación'] === s).length}</span></button>`).join('');
  return `<div class="wrap" style="padding-top:0">
    <div class="sticky">
      <h1 class="disp" style="font-size:32px;margin-top:8px">Buscar</h1>
      <label class="search">${ICON.search}<span class="sr">Buscar en toda la colección</span>
        <input id="qg" type="search" placeholder="Título o comentario, en todas las consolas" value="${esc(S.gq)}" autocomplete="off"></label>
      <div class="row-scroll">${chips}</div>
    </div>
    <div id="lista">${htmlBuscar()}</div>
  </div>`;
}
function htmlBuscar() {
  const q = S.gq.trim().toLowerCase();
  if (!q && !S.gsit) return '<div class="empty">Busca en todas las consolas a la vez, también en vendidos y deseados.<br>O toca un filtro para ver, por ejemplo, todo lo que tienes en venta.</div>';
  let l = IDX.juegos;
  if (S.gsit) l = l.filter(g => g['Situación'] === S.gsit);
  if (q) l = l.filter(g => String(g['Título']).toLowerCase().includes(q) || String(g['Comentarios'] || '').toLowerCase().includes(q));
  if (!l.length) return '<div class="empty">Sin resultados.</div>';
  const extra = l.length > 150 ? `<p class="muted" style="font-size:12px">Mostrando 150 de ${l.length}. Afina la búsqueda.</p>` : '';
  return '<div class="list">' + l.slice(0, 150).map(g => filaJuego(g, true)).join('') + '</div>' + extra;
}

function vFinanzas() {
  const f = S.data && S.data.finanzas;
  const filas = (f && f.filas) || [];
  const tot = k => filas.reduce((a, r) => a + (n(r[k]) || 0), 0);
  const card = r => `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:56px;height:40px;display:grid;place-items:center;flex:none">${r['Logo'] ? `<img loading="lazy" alt="" src="${esc(r['Logo'])}" style="max-width:56px;max-height:40px;object-fit:contain">` : ''}</span>
        <b style="flex:1;font-family:'Bricolage Grotesque',sans-serif;font-size:18px">${esc(r['Sistema'])}</b>
        <span class="muted" style="font-size:13px">${esc(nfmt(r['Nº de juegos']))} juegos</span>
      </div>
      <div class="grid2" style="gap:8px;font-size:13px">
        <div><span class="muted">Valor colección</span><div class="money">${eur(n(r['Valor colección']))}</div></div>
        <div><span class="muted">Balance actual</span><div style="font-weight:700;font-size:16px">${signo(n(r['Inversión actual']))}</div></div>
        <div><span class="muted">Compras</span><div style="font-weight:600">${eur(n(r['Compras']))}</div></div>
        <div><span class="muted">Ventas</span><div style="font-weight:600">${eur(n(r['Ventas']))}</div></div>
      </div></div>`;
  return `<div class="wrap stack" style="gap:18px">
    <header><p class="eyebrow">Pestaña Finanzas · solo lectura</p><h1 class="disp" style="font-size:34px;margin-top:6px">Finanzas</h1></header>
    ${filas.length ? `<div class="card" style="padding:18px;display:flex;flex-direction:column;gap:6px">
      <span class="muted" style="font-size:13px">Valor de la colección</span>
      <div class="disp" style="font-size:42px;color:var(--amb)">${eur(tot('Valor colección'))}</div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--tx2)">
        <span>Compras ${eur(tot('Compras'))}</span><span>Ventas ${eur(tot('Ventas'))}</span><span>Balance ${signo(tot('Inversión actual'))}</span></div>
      <p class="muted" style="margin:6px 0 0;font-size:12px">Suma de las ${filas.length} consolas fiables de tu pestaña Finanzas. La app no recalcula nada: lee tus fórmulas.</p>
    </div>` : '<div class="empty">Sin datos de Finanzas.</div>'}
    ${filas.map(card).join('')}
  </div>`;
}

function vAjustes() {
  const u = S.cfg ? S.cfg.url : '';
  return `<div class="wrap stack" style="gap:18px">
    <div style="display:flex;align-items:center;gap:6px"><a class="iconbtn" href="#/" aria-label="Volver" style="margin-left:-10px;color:inherit">${ICON.back}</a><h1 class="disp" style="font-size:28px">Ajustes</h1></div>
    <div class="card" style="padding:16px;font-size:14px;line-height:1.6">
      <div class="muted" style="font-size:12px">Conectado a</div>
      <div style="word-break:break-all">${esc(u.replace(/(\/s\/.{6}).+(.{6}\/exec)/, '$1…$2'))}</div>
      <div class="muted" style="font-size:12px;margin-top:8px">Última actualización</div><div>${esc(hace(S.data && S.data.generado))}</div>
      <div class="muted" style="font-size:12px;margin-top:8px">Juegos cargados</div><div>${IDX.juegos.length}</div>
    </div>
    <button class="btn" data-act="sync">${S.cargando ? 'Actualizando…' : 'Actualizar ahora'}</button>
    <a class="btn sec2" href="#/conectar" style="text-decoration:none">Cambiar URL o clave</a>
    <button class="btn sec2" data-act="olvidar" style="color:var(--red)">Olvidar la clave en este dispositivo</button>
    <p class="muted" style="font-size:12px;line-height:1.5">La clave y la copia de tus datos se guardan solo en este dispositivo. RetroPi v1 · solo lectura.</p>
  </div>`;
}

const vNoEncontrado = () => `<div class="wrap"><div class="empty">No encontrado. <a href="#/">Volver al inicio</a></div></div>`;

/* ============ router ============ */
function ruta() { const h = location.hash.replace(/^#\/?/, ''); const [a, b] = h.split('/'); return { a: a || 'home', b: b ? decodeURIComponent(b) : '' }; }

function render() {
  const r = ruta();
  const sinConfig = !S.cfg || r.a === 'conectar';
  let html;
  if (sinConfig) html = vSetup();
  else if (!S.data) html = `<div class="wrap"><div class="empty">${S.cargando ? 'Cargando tu colección…' : 'Sin datos. <button class="small-btn" data-act="sync" style="margin:12px auto 0">Reintentar</button>'}</div></div>`;
  else if (r.a === 'c') html = vConsola(r.b);
  else if (r.a === 'j') html = vJuego(r.b);
  else if (r.a === 'buscar') html = vBuscar();
  else if (r.a === 'finanzas') html = vFinanzas();
  else if (r.a === 'ajustes') html = vAjustes();
  else html = vHome();
  const keepScroll = render._last === location.hash;
  const y = window.scrollY;
  $('#app').innerHTML = html;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render._last = location.hash;
  const nav = $('#nav'); nav.hidden = sinConfig;
  const tab = r.a === 'buscar' ? 'buscar' : r.a === 'finanzas' ? 'finanzas' : 'home';
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
}
function pintarEstado() { if (ruta().a === 'home' || ruta().a === 'ajustes') render(); }

/* ============ eventos ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  if (act === 'sync') { cargar(); }
  else if (act === 'filtro') { const id = ruta().b; S.filtro[id] = v; render(); }
  else if (act === 'gsit') { S.gsit = S.gsit === v ? '' : v; $('#lista').innerHTML = htmlBuscar(); document.querySelectorAll('[data-act="gsit"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.gsit)); }
  else if (act === 'sort') { const k = Object.keys(SORTS); S.ui.sort = k[(k.indexOf(S.ui.sort) + 1) % k.length]; LS.set('rp.ui', S.ui); render(); }
  else if (act === 'view') { S.ui.view = v; LS.set('rp.ui', S.ui); render(); }
  else if (act === 'back') { if (history.length > 1) history.back(); else location.hash = '#/'; }
  else if (act === 'olvidar') { if (confirm('¿Olvidar la clave y los datos guardados en este dispositivo?')) { LS.del('rp.cfg'); LS.del('rp.data'); S.cfg = null; S.data = null; preparar(); location.hash = '#/'; render(); } }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qc') { const id = e.target.dataset.c; S.q[id] = e.target.value; const c = IDX.consolas.find(x => x.id === id); $('#lista').innerHTML = htmlLista(c); }
  else if (e.target.id === 'qg') { S.gq = e.target.value; $('#lista').innerHTML = htmlBuscar(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fsetup') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const cfg = { url: String(fd.get('url')).trim(), key: String(fd.get('key')).trim() };
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(cfg.url)) { toast('La URL debe ser la de script.google.com y terminar en /exec'); return; }
  S.cargando = true; render();
  const ok = await cargar(cfg, true);
  if (ok) { S.cfg = cfg; LS.set('rp.cfg', cfg); toast('Conectado'); location.hash = '#/'; render(); }
});
window.addEventListener('hashchange', render);

/* ============ arranque ============ */
preparar();
render();
if (S.cfg) cargar(null, true);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

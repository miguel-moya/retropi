name: Portadas
# Descarga portadas de ScreenScraper y las guarda en covers/. Se lanza a mano (Actions → Portadas → Run workflow)
# y una vez por semana para los juegos nuevos.
on:
  workflow_dispatch:
    inputs:
      reintentar:
        description: 'Volver a buscar los que no se encontraron'
        type: boolean
        default: false
      extras:
        description: 'Descargar también el logo'
        type: boolean
        default: false
      forzar:
        description: 'Volver a buscar todos los títulos'
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency: portadas
jobs:
  portadas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # las imágenes van en la rama «portadas», separada de la web para que publicar la app sea rápido
      - uses: actions/checkout@v4
        with:
          ref: portadas
          path: datos
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar portadas
        env:
          SS_DEVID: ${{ secrets.SS_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SS_DEVPASSWORD }}
          SS_USER: ${{ secrets.SS_USER }}
          SS_PASSWORD: ${{ secrets.SS_PASSWORD }}
          RETROPI_URL: ${{ secrets.RETROPI_URL }}
          RETROPI_KEY: ${{ secrets.RETROPI_KEY }}
          REINTENTAR: ${{ inputs.reintentar && '1' || '' }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
          EXTRAS: ${{ (github.event_name == 'schedule' || inputs.extras) && '1' || '' }}
        working-directory: datos
        run: node ../scripts/portadas.mjs
      - name: Guardar en la rama portadas
        working-directory: datos
        run: |
          git config user.name "RetroPi portadas"
          git config user.email "actions@users.noreply.github.com"
          git add covers
          git diff --cached --quiet || (git commit -m "Portadas: actualización automática" && git push)
